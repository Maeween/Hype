# ============================================================
#  HYPE — En-têtes de cache
#  Fichier à placer À LA RACINE du repo, à côté de index.html
#
#  À QUOI ÇA SERT
#  Aujourd'hui, chaque visite retélécharge TOUS les fichiers du site,
#  y compris les images et les paquets d'images qui ne changent jamais.
#  Avec ces règles, le navigateur les garde en mémoire et ne les
#  redemande plus. La bande passante consommée chute fortement pour
#  tous les visiteurs qui reviennent.
#
#  PRINCIPE
#  - index.html : jamais mis en cache (sinon tes mises à jour ne
#    seraient pas vues). C'est un petit fichier au regard du reste.
#  - Tout le reste (images, paquets d'images, scripts) : mis en cache
#    très longtemps, car ces fichiers ne changent pas. Quand tu en
#    modifies un, tu changes son nom (k610, k611...) et le navigateur
#    va chercher le nouveau.
# ============================================================

# ============================================================
#  AJOUT DU 10/10/2026 — NE PUBLIER QUE LES ENVOIS MARQUÉS [publier]
#  Pourquoi : 505 mises en ligne en un mois (chaque fichier envoyé sur GitHub
#  en déclenchait une) = 7 575 crédits Netlify sur 10 430, site mis en pause
#  le 10/10. Chaque mise en ligne RÉUSSIE en production coûte 15 crédits ;
#  une mise en ligne annulée par cette règle ne coûte rien.
#  Règle : Netlify lit le message du dernier envoi ; s'il ne contient pas
#  « [publier] », il n'y a pas de mise en ligne (le site reste tel quel).
#  ⚠️ Un fichier envoyé à la main sur GitHub ne sera donc PAS mis en ligne,
#  sauf si le message de l'envoi contient [publier].
#  Code de sortie : 0 = annuler la mise en ligne, 1 = mettre en ligne.
# ============================================================
[build]
  ignore = "git log -1 --pretty=%B | grep -qF '[publier]' && exit 1 || exit 0"
  # 11/10/2026 (951) : au moment de publier, Netlify retire les commentaires de SA copie d'index.html (−15 % brut,
  # −20 % compressé). Le dépôt garde tous ses commentaires. Garde-fous dans outils/alleger-index.cjs : en cas de
  # doute, l'index part tel quel ; la publication n'échoue jamais à cause de ce script.
  # POUR ANNULER : supprimer la ligne « command » ci-dessous.
  # 12/10/2026 (référencement, action 2) : seo-accueil.cjs ajoute ensuite le texte de l'accueil pour Google dans la
  # copie publiée d'index.html, et garde une copie sans ce texte (app-base.html) pour les pages /cheval/, /ecurie/,
  # /evenement/. Il ne fait jamais échouer la publication. 12/10 : seo-galops.cjs fabrique ensuite les pages publiques de la
  # théorie des Galops (/<langue>/galops/…) et sitemap-galops.xml, à partir des fichiers de cours ; jamais bloquant non plus. POUR ANNULER : remettre la ligne sans « ; node outils/seo-accueil.cjs ».
  # 12/10/2026 : seo-departements.cjs fabrique /fr/centres-equestres/… (écuries par département) et sitemap-departements.xml ; jamais bloquant.
  command = "node outils/alleger-index.cjs; node outils/seo-accueil.cjs; node outils/seo-galops.cjs; node outils/seo-departements.cjs"

# ---------- 12/10/2026 : la copie de l'appli pour les pages publiques (référencement) ----------
# Jamais rangée par Google (c'est l'accueil sans son texte), toujours fraîche.
[[headers]]
  for = "/app-base.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

# ---------- Le document principal : toujours frais ----------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- Les images : un an de cache ----------
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Les paquets d'images en base64 (hype-images-NN.js) ----------
[[headers]]
  for = "/hype-images-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Les autres scripts de contenu ----------
[[headers]]
  for = "/hype-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/complement-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Icônes, manifeste, polices ----------
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Le manifeste et le service worker : frais ----------
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------- Compression : Netlify le fait déjà, mais on s'assure ----------
# (rien à configurer, Netlify sert automatiquement en Brotli/gzip)

# ============================================================
#  AJOUT DU 10/08/2026 — LES VIDÉOS (demande de Blandine : « fais le »)
#
#  POURQUOI MAINTENANT : le film d'ouverture de Linguae joue désormais
#  à CHAQUE connexion et pour TOUT LE MONDE (lingo.html v62). Sans
#  règle de cache, `ouverture.mp4` était retéléchargé en entier à
#  chaque visite : bande passante Netlify qui grimpe, et démarrage du
#  film plus lent sur un réseau moyen. Avec cette règle, il est
#  téléchargé UNE FOIS puis rejoué depuis la mémoire du téléphone.
#
#  ⚠️ CONSÉQUENCE À CONNAÎTRE : `immutable` veut dire « ce fichier ne
#  changera jamais ». Si tu remplaces `ouverture.mp4` par une nouvelle
#  version SANS changer son nom, les visiteurs qui l'ont déjà en cache
#  continueront de voir l'ANCIEN film, jusqu'à un an. Pour diffuser un
#  nouveau film, change son nom de fichier (ouverture-2.mp4) et
#  l'adresse qui le charge dans lingo.html — comme pour les images
#  (k610, k611...). C'est la même règle que le reste de ce fichier.
# ============================================================

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
#  AJOUT DU 10/08/2026 — LA PURGE AUTOMATIQUE DES COMPTES SUPPRIMÉS
#  Ordre de Blandine : « on continue et planification pour la purge ».
#
#  CE QUI MANQUAIT : `supprimer-compte.js` désactivait bien les comptes à
#  J+60, mais la purge définitive n'était appelée PAR PERSONNE — aucune
#  planification n'existait. Les comptes restaient marqués « supprimé »
#  indéfiniment sans jamais l'être vraiment. Point bloquant App Store.
#
#  CETTE SECTION EST CE QUI DÉCLENCHE `purge-planifiee.js`. Sans elle, le
#  fichier existe mais ne tourne jamais. NE PAS LA SUPPRIMER.
#
#  "0 3 * * *" = chaque nuit à 3 h UTC (5 h en France l'été, 4 h l'hiver).
#  Heure creuse volontaire : la purge peut supprimer plusieurs comptes et
#  leurs fichiers d'un coup.
# ============================================================

[functions."purge-planifiee"]
  schedule = "0 3 * * *"
