name: Deployer les fonctions Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deployer:
    # 14/10/2026 (livraison A) — GARDE-FOU : avant, tout envoi sur main touchant supabase/functions
    # déployait AUSSITÔT les fonctions Supabase, sans le marqueur [publier] exigé pour le site.
    # Désormais : déploiement seulement si le message de l'envoi contient [fonctions],
    # ou à la main (onglet Actions › « Run workflow »).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fonctions]')
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ldpjebgtskzdokrublfg

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy mux-upload --project-ref $PROJECT_ID

      # 26/09 : analyse photo de Hey Baby (limite de temps de Netlify trop courte)
      - run: supabase functions deploy hey-baby-vision --project-ref $PROJECT_ID

      # 09/10 : notification « Nouvel abonnement » sur l'iPhone de Blandine.
      # --no-verify-jwt OBLIGATOIRE : c'est la base qui l'appelle, sans jeton
      # (sans ce drapeau, la ligne de commande remet le contrôle et tout appel est refusé).
      - run: supabase functions deploy notifier-abonnement --no-verify-jwt --project-ref $PROJECT_ID
