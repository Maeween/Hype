# HYPE — coque native Android (même coque Capacitor que l'iPhone), construite par GitHub.
#
# Décision de Blandine (12/11, « Ok 2 ») : Google Play d'abord, avec la MÊME coque que l'iPhone
# (sélecteur photos/vidéos natif + envoi avec progression), pas une simple coque web légère.
#
# UN SEUL FICHIER : celui-ci. Il fabrique lui-même le dossier natif-android/ sur la machine de GitHub.
#   - Sans aucun secret : il construit une version d'ESSAI (APK « debug ») téléchargeable dans
#     l'onglet Actions. Elle sert à vérifier que la coque se construit bien.
#   - Avec les 4 secrets de signature (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) : il construit en plus le paquet SIGNÉ pour
#     Google Play (fichier .aab), à déposer la première fois à la main dans la Play Console.
#   - si un jour un fichier existe dans le dépôt sous natif-android/ (ex. natif-android/resources/icon-only.png),
#     il est gardé tel quel et remplace la version fabriquée ici.
# Se déclenche à la main (Actions → « Android — build » → Run workflow) ou à chaque poussée qui
# touche ce fichier ou natif-android/. Ne touche jamais au site : aucune mise en ligne Netlify.
# Rien de secret n'est écrit ici : le dépôt est public.

name: Android — build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "natif-android/**"

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ---- À fixer AVANT le premier envoi sur Google Play (l'identifiant ne se change plus ensuite) :
      HYPE_APP_ID: fr.ecuriefeinn.hype
      HYPE_APP_NAME: Hype
      HYPE_SITE: https://2hype.fr
    steps:
      - uses: actions/checkout@v4

      - name: Fabriquer le projet natif Android
        run: |
          set -e
          mkdir -p natif-android/www
          ecrire() { if [ -f "$1" ]; then echo "garde : $1 (present dans le depot)"; cat > /dev/null; else cat > "$1"; echo "ecrit : $1"; fi; }

          ecrire natif-android/package.json << 'EOF'
          {
            "name": "hype-natif-android",
            "private": true,
            "version": "1.0.0",
            "description": "Coque native Android de Hype (Capacitor) : affiche le site et lui prete le selecteur photos/videos natif et l'envoi avec progression.",
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capgo/capacitor-file-picker": "latest",
              "@capgo/capacitor-uploader": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "@capacitor/assets": "^3.0.0"
            }
          }
          EOF

          ecrire natif-android/capacitor.config.json << EOF
          {
            "appId": "${HYPE_APP_ID}",
            "appName": "${HYPE_APP_NAME}",
            "webDir": "www",
            "server": {
              "url": "${HYPE_SITE}",
              "errorPath": "erreur.html",
              "allowNavigation": ["2hype.fr", "www.2hype.fr", "2hype.netlify.app", "*.supabase.co", "*.mux.com"]
            },
            "android": {
              "backgroundColor": "#060709",
              "allowMixedContent": false
            }
          }
          EOF

          ecrire natif-android/www/index.html << EOF
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hype</title>
          <style>html,body{margin:0;height:100%;background:#060709;color:#F3EEE4;font-family:Montserrat,sans-serif}.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.h{font-family:Cinzel,Georgia,serif;letter-spacing:6px;color:#C9A66B;font-size:34px}</style></head>
          <body><div class="c"><div class="h">HYPE</div><div style="color:#8A8F94;font-size:13px">Chargement…</div></div>
          <script>setTimeout(function(){try{location.href="${HYPE_SITE}/";}catch(e){}},1500);</script>
          </body></html>
          EOF

          ecrire natif-android/www/erreur.html << EOF
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hype</title>
          <style>html,body{margin:0;height:100%;background:#060709;color:#F3EEE4;font-family:Montserrat,sans-serif}.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 28px;text-align:center}.h{font-family:Cinzel,Georgia,serif;letter-spacing:6px;color:#C9A66B;font-size:34px}p{color:#C9C3B8;font-size:14px;line-height:1.55;margin:0}button{margin-top:6px;padding:13px 26px;border-radius:999px;border:1px solid #C9A66B;background:transparent;color:#D8BA82;font-size:15px;font-weight:600}</style></head>
          <body><div class="c"><div class="h">HYPE</div><p>Hype n'arrive pas à se connecter.<br>Vérifie ta connexion, puis réessaie.</p><button onclick="location.href='${HYPE_SITE}/'">Réessayer</button></div></body></html>
          EOF
          echo "--- natif-android/ ---"; find natif-android -type f | sort

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dépendances (Capacitor + plugins)
        working-directory: natif-android
        run: npm install --no-audit --no-fund

      - name: Projet Android (généré s'il n'est pas dans le dépôt)
        working-directory: natif-android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Icône et écran de lancement (seulement si natif-android/resources/icon-only.png est dans le dépôt)
        working-directory: natif-android
        run: |
          if [ -f resources/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#060709' --iconBackgroundColorDark '#060709' --splashBackgroundColor '#060709' --splashBackgroundColorDark '#060709' || echo "assets ignores, icone par defaut"
          else
            echo "pas de natif-android/resources/icon-only.png dans le depot : icone par defaut"
          fi

      - name: Synchronisation Capacitor
        working-directory: natif-android
        run: npx cap sync android

      - name: Numéro de version (un nouveau à chaque construction)
        working-directory: natif-android/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          grep -E "versionCode|versionName|applicationId" app/build.gradle

      - name: Version d'essai (APK debug)
        working-directory: natif-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Garder la version d'essai (onglet Actions, 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: Hype-android-essai-apk
          path: natif-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Secrets de signature présents ?
        id: sig
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Pas de secrets de signature : seule la version d'essai est construite (voir SUIVI.md, section GOOGLE PLAY)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Paquet signé pour Google Play (.aab)
        if: steps.sig.outputs.ok == 'true'
        working-directory: natif-android/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hype-upload.jks"
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/hype-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/hype-upload.jks"

      - name: Garder le paquet Google Play (onglet Actions, 30 jours)
        if: steps.sig.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hype-android-google-play-aab
          path: natif-android/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
