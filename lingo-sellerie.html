<style>
/* ==================================================================
   MA SELLERIE — session 209, tiree de `maquette-sellerie.html` v31.
   Meme motif que la collection et le globe : une page a part, chargee en
   iframe par `lingo.html`, qui dialogue par postMessage. Ce n'est pas un
   choix nouveau, c'est l'architecture deja en place pour les deux autres
   grands ecrans de Linguae.

   CE QUI VIENT DE lingo.html : la langue, le temoin de version, le
   prefixe d'images, la liste des objets GAGNES, et l'amenagement deja
   enregistre (poses + cadrages de vue).
   CE QUI REPART VERS lingo.html : l'amenagement, a chaque changement.
   La sellerie ne parle jamais a Supabase : c'est `lingo.html` qui ecrit,
   dans la progression Linguae. Une seule frontiere, un seul proprietaire.
   ================================================================== */
:root{ --or:#C9A961; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;overflow:hidden;height:100%}
body{background:#0B0805;font-family:'Montserrat',sans-serif;color:#E8DCC0}
#haut{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
 justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
 background:linear-gradient(180deg,rgba(11,8,5,.85),transparent);pointer-events:none}
/* v8 de la maquette : le bandeau avalait les doigts sur toute sa hauteur
   (son degrade est transparent mais il capte quand meme). Seuls ses
   boutons restent touchables ; un objet pose haut reste saisissable. */
#haut button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(232,220,192,.3);
 background:rgba(11,8,5,.4);color:#E8DCC0;font-size:16px;cursor:pointer;pointer-events:auto}
#haut h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;margin:0}
#scene{position:fixed;inset:0;display:flex;touch-action:none;
 transition:transform .38s cubic-bezier(.25,.8,.3,1)}
.mur{position:relative;flex:0 0 100vw;height:100vh;overflow:hidden}
.mur > .dedans{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.mur img.fondmur{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#zoomBarre{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:23;
 display:flex;flex-direction:column;gap:6px}
#zoomBarre button{width:38px;height:38px;border-radius:10px;
 border:1px solid rgba(201,169,97,.45);background:rgba(11,8,5,.8);color:#E8DCC0;
 font-size:17px;line-height:1;cursor:pointer}
#zoomBarre span{font-size:9px;text-align:center;color:rgba(232,220,192,.6)}
#tailleBarre{position:fixed;left:50%;transform:translateX(-50%);
 bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:23;display:none;gap:10px}
#tailleBarre.on{display:flex}
#tailleBarre button{width:46px;height:46px;border-radius:12px;
 border:1px solid rgba(201,169,97,.5);background:rgba(11,8,5,.9);color:#C9A961;
 font-size:22px;line-height:1;cursor:pointer}
#points{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 84px);left:0;right:0;
 display:flex;justify-content:center;gap:8px;z-index:20;pointer-events:none}
#points i{width:7px;height:7px;border-radius:50%;background:rgba(232,220,192,.3)}
#points i.on{background:var(--or)}
#nomMur{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 98px);left:0;right:0;
 text-align:center;z-index:20;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
 color:rgba(232,220,192,.55);pointer-events:none}
.fenZone{position:absolute;cursor:grab}
#grandeVue{position:fixed;inset:0;z-index:40;background:#0B0805;display:none;
 align-items:center;justify-content:center;flex-direction:column}
#grandeVue.on{display:flex}
#grandeVue img{max-width:94%;max-height:82%;border-radius:8px;
 box-shadow:0 30px 80px rgba(0,0,0,.8)}
#grandeVue p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;margin:16px 0 0}
#grandeVue span{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(232,220,192,.5)}
/* v8 de la maquette : sur un mur perce, l'image du mur est en z-index 1
   (la vue passe DERRIERE, dans le percage) et la zone de la fenetre en 3.
   Un objet sans z-index etait donc peint SOUS le mur : invisible et
   intouchable. D'ou le 6 ci-dessous, et le 14 quand il est tenu. */
.obj{position:absolute;z-index:6;touch-action:none;cursor:grab;filter:drop-shadow(4px 9px 8px rgba(0,0,0,.55))}
.obj img{width:100%;height:auto;display:block;pointer-events:none}
.obj.tenu{filter:drop-shadow(0 0 14px rgba(201,169,97,.7));z-index:14}
/* le jumeau : le MEME objet, vu depuis l'autre angle. Il ne se saisit pas
   (on le deplace depuis le mur ou il a ete pose) et il ne porte pas le
   halo de l'objet tenu, pour qu'on comprenne lequel des deux on tient. */
.obj.jumeau{cursor:default}
#reserve{position:fixed;bottom:0;left:0;right:0;z-index:22;
 background:linear-gradient(0deg,rgba(11,8,5,.96) 70%,transparent);

#aide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 118px);

#aide.on{opacity:1}
/* ⚠️ AJOUT DU 14/08 — LE BANDEAU D'INCIDENT.
   Le 12/08 la page est morte en silence : ecran noir, aucun message. Une
   page qui meurt sans rien dire est un defaut en soi. Ce bandeau affiche
   l'erreur EN CLAIR, par-dessus tout, et ne se ferme qu'au doigt. Il ne
   coute rien tant que rien ne casse. A retirer quand la sellerie sera
   sereine — c'est un filet, pas un meuble. */

 background:#3A1414;border-top:1px solid #C9A961;color:#F0DCC0;

#incident i{display:block;font-style:normal;margin-top:5px;
 color:rgba(240,220,192,.6);font-size:10px}

<script>
/* ⚠️ AJOUT DU 14/08 — L'ATTRAPE-ERREUR, POSE AVANT TOUT LE RESTE.
   Il est ici, en tete de page, pour saisir aussi les erreurs qui
   surviendraient pendant la construction de l'ecran. `signaler()` est
   volontairement autonome : il ne depend d'aucune fonction du fichier,
   pour rester vivant meme quand le reste est tombe. */
function signaler(t){
  try{
    var b = document.getElementById('incident');
    var s = document.getElementById('incidentTxt');
    if(!b || !s) return;
    s.textContent = (s.textContent ? s.textContent + ' · ' : '') + t;
    b.classList.add('on');
  }catch(e){}
}
window.addEventListener('error', function(ev){
  signaler((ev.message || 'erreur') +
           (ev.lineno ? ' (ligne ' + ev.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(ev){
  signaler('promesse rejetee : ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
});
document.addEventListener('DOMContentLoaded', function(){
  var b = document.getElementById('incident');
  if(b) b.addEventListener('click', function(){ this.classList.remove('on'); });
});
</script>

<script>
/* ==================================================================
   LES HUIT MURS, DANS L'ORDRE DE LA BANDE.
   Le circuit et son sens sont ceux de la maquette v31, valides par
   Blandine : arrivee de loin, un pas plus pres, puis le cercle des six
   murs — la fenetre, l'angle de la vitrine, la vitrine, la porte, le mur
   des selles, l'angle des selles — et on revient a la fenetre. En rond,
   dans les deux sens. Les deux vues d'arrivee sont HORS du cercle : on y
   revient par les points de navigation, qui sont cliquables.
   `biais` marque les deux angles : c'est la que le moteur prend la vue
   de trois quarts d'un objet, quand elle existe.
   ================================================================== */
var MURS = [
  {id:"entreeloin",  f:"sellerie-entree-loin.webp",  arrivee:true},
  {id:"entreevue",   f:"sellerie-entree-vue.webp",   arrivee:true},
  {id:"fond",        f:"sellerie-fond-perce.webp"},
  {id:"droitebiais", f:"sellerie-droite-biais.webp", biais:true},
  {id:"droite",      f:"sellerie-droite.webp"},
  {id:"entree",      f:"sellerie-entree.webp"},
  {id:"gauche",      f:"sellerie-gauche.webp"},
  {id:"gauchebiais", f:"sellerie-gauche-biais.webp", biais:true}
];
var FACES = [2,3,4,5,6,7];      /* le cercle, apres les DEUX vues d'arrivee */

/* ==================================================================
   LES DEUX MURS D'UN MEME MUR (12 aout 2026 — ORDRE DE BLANDINE :
   « tout devait apparaitre, c'est pour ca que tu as les images de
   profil »). Un objet pose sur le mur des selles doit se retrouver sur
   l'angle des selles, a sa vraie place et vu sous son vrai angle.

   La pose reste LIBRE au doigt : c'est le moteur qui calcule ou l'objet
   tombe dans l'autre vue. Pour ca il faut quatre points qu'on reconnait
   dans les DEUX images du meme mur — ici deux porte-selles et les deux
   bouts de l'etagere — et une homographie, qui est la transformation
   exacte d'un plan photographie sous deux angles. Une regle de trois ne
   suffirait pas : la perspective n'est pas lineaire.

   ⚠️ LES QUATRE POINTS CI-DESSOUS SONT RELEVES A L'OEIL sur les images
   livrees, en % du mur. Ils sont justes a un ou deux pour cent pres, ce
   qui suffit a tomber sur le bon porte-selle, mais ils demandent l'essai
   de Blandine pour etre affines. C'est la seule valeur approchee de tout
   l'ecran, et elle est ici, en clair, pour etre corrigee en une ligne.

   ⚠️ LA VITRINE N'EST PAS APPARIEE : `sellerie-droite.webp` vient
   d'arriver et n'a pas ete comparee a `sellerie-droite-biais.webp`. Tant
   que la paire n'est pas mesuree, on ne la declare pas — un objet mal
   place vaut moins qu'un objet absent. Signale, pas devine.
   ================================================================== */
var PAIRES = {
  gauche: {
    jumeau: "gauchebiais",
    pts: [[31,51,17,50], [69,51,41,53], [21,27,10,22], [78,27,47,30]]
  },
  gauchebiais: { jumeau: "gauche" },
  /* LA VITRINE, mesuree le 12/08 apres l'arrivee de `sellerie-droite.webp`.
     Points de calage : les deux bouts du rail de crochets, le haut droit de
     la vitrine, et la console basse. Ils sont volontairement REPARTIS en
     hauteur : un premier essai avec quatre points groupes dans le haut du
     mur donnait 12 % d'erreur en bas — une homographie ne s'extrapole pas.
     Controles hors calage : l'etagere tombe a 58,6/40,2 pour 59/40 a l'oeil,
     le milieu de la vitrine a 84,5/50,5 pour 83/50. Juste au tout haut du
     mur (y < 20 %) l'ecart monte a 8 % : c'est la ou la vitrine occupe
     deja la place, donc peu de poses. */
  droite: {
    jumeau: "droitebiais",
    pts: [[10,45,51,48], [38,45,67,47], [82,15,96,17], [22,74,58,72]]
  },
  droitebiais: { jumeau: "droite" }
};
/* resolution d'un systeme lineaire par pivot de Gauss : huit inconnues
   pour les huit coefficients de l'homographie (le neuvieme vaut 1). */
function resoudre(A, b){
  var n = b.length, i, j, k;
  for(i = 0; i < n; i++){
    var p = i;
    for(j = i + 1; j < n; j++){ if(Math.abs(A[j][i]) > Math.abs(A[p][i])) p = j; }
    var t = A[i]; A[i] = A[p]; A[p] = t;
    var u = b[i]; b[i] = b[p]; b[p] = u;
    if(Math.abs(A[i][i]) < 1e-12) return null;
    for(j = i + 1; j < n; j++){
      var f = A[j][i] / A[i][i];
      for(k = i; k < n; k++) A[j][k] -= f * A[i][k];
      b[j] -= f * b[i];
    }
  }
  var x = new Array(n);
  for(i = n - 1; i >= 0; i--){
    var so = b[i];
    for(j = i + 1; j < n; j++) so -= A[i][j] * x[j];
    x[i] = so / A[i][i];
  }
  return x;
}
function homographie(pts){
  var A = [], b = [];
  for(var i = 0; i < 4; i++){
    var x = pts[i][0], y = pts[i][1], X = pts[i][2], Y = pts[i][3];
    A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]); b.push(Y);
  }
  return resoudre(A, b);
}
var HOMO = {};
Object.keys(PAIRES).forEach(function(id){
  var P = PAIRES[id]; if(!P.pts) return;
  var h = homographie(P.pts); if(!h) return;
  HOMO[id + ">" + P.jumeau] = h;
  /* et le chemin inverse, pour un objet pose depuis l'angle */
  var inv = P.pts.map(function(q){ return [q[2], q[3], q[0], q[1]]; });
  var h2 = homographie(inv); if(h2) HOMO[P.jumeau + ">" + id] = h2;
});
function projeter(depuis, vers, x, y){
  var h = HOMO[depuis + ">" + vers]; if(!h) return null;
  var d = h[6] * x + h[7] * y + 1;
  if(Math.abs(d) < 1e-9) return null;
  return {x:(h[0] * x + h[1] * y + h[2]) / d, y:(h[3] * x + h[4] * y + h[5]) / d};
}
function jumeauDe(idMur){ var P = PAIRES[idMur]; return P ? P.jumeau : null; }

/* Chaque arche est mesuree sur l'image livree : [x, y, largeur, hauteur]
   en % du mur. Les cinq murs perces n'ont pas la meme fenetre. */
var ARCHES = {
  fond:        [35.2, 25.9, 30.1, 34.6],
  entreeloin:  [40.7, 27.3, 18.1, 24.5],
  entreevue:   [38.0, 27.1, 23.7, 30.3],
  gauchebiais: [81.7, 23.7, 18.3, 33.1],
  droitebiais: [ 0.0, 23.9, 13.6, 34.6]
};

/* les mots de l'ecran, dans les six langues obligatoires */

var NOMS_MURS = {

};

/* ------------------------------------------------------------------
   L'ETAT. Tout vient de lingo.html ; rien n'est invente ici.
   POSES : ref -> {mur, x, y, l, mir}   (x, y, l en % DU MUR)
   CADRAGE : ref de ville -> {z, ox, oy}  (le cadrage de la vue par ville)
   ------------------------------------------------------------------ */
var LANGUE = "fr", VER = "", PREF = "", PIECE = "classique";
var OBJETS = [];             /* [{ref, nom, pose, pose34}] les objets gagnes */
var POSES = {}, CADRAGE = {};
var VUE_IMG = "", VUE_NOM = "", VUE_NAT = "";
var mur = 0, pret = false;

function S(i){ return document.getElementById(i); }
function M(c){ var o = MOTS[c] || {}; return o[LANGUE] || o.fr || ""; }
function nomMurDe(id){ var o = NOMS_MURS[id] || {}; return o[LANGUE] || o.fr || ""; }
function img(nom){ return PREF + nom + VER; }
function objetDe(r){ for(var i=0;i<OBJETS.length;i++){ if(OBJETS[i].ref===r) return OBJETS[i]; } return null; }

/* LE MOTEUR CHOISIT LA VUE, PAS LA JOUEUSE (regle posee par Blandine le
   12/08 : « c'est a toi d'utiliser les autres images »). Un objet n'a
   qu'UNE vignette dans la reserve, sa vue perpendiculaire ; sur un mur
   vu en biais, on prend sa vue de trois quarts quand elle existe, sinon
   on retombe sur la perpendiculaire — jamais de trou. */
function imageObjet(r, idMur){
  var o = objetDe(r); if(!o) return "";
  var m = null;
  for(var i=0;i<MURS.length;i++){ if(MURS[i].id===idMur) m = MURS[i]; }
  if(m && m.biais && o.pose34) return img(o.pose34);
  return img(o.pose);
}

/* ------------------ la scene : un mur par ecran ------------------ */
var sc = S('scene');
MURS.forEach(function(m){
  var d = document.createElement('div');
  d.className = 'mur'; d.id = 'mur-' + m.id;
  d.innerHTML = '<div class="dedans" id="dedans-' + m.id + '">'
              + '<img class="fondmur" alt="" src=""></div>';
  sc.appendChild(d);
});

/* ------------------ LA BANDE TOURNE (14/08) ------------------
   La bande est un ruban droit : `translateX(-place x 100vw)`. Du dernier
   mur du cercle au premier il y avait cinq murs a remonter, donc un saut
   instantane a chaque tour complet.
   Remede : `mur` reste l'INDICE DANS `MURS` (tout le reste du fichier
   s'appuie dessus — `POSES[r].mur`, `MURS[p.mur].id`, les points de
   navigation), et une table `PLACE` dit ou chaque mur se range dans le
   ruban. Avant un pas qui boucle, on fait tourner les six murs du cercle
   par la propriete `order` du flex : aucun clone, aucune image
   rechargee, les objets poses suivent leur mur. Le mur courant garde sa
   place sous les yeux pendant la rotation — elle est donc invisible.
   Les deux vues d'arrivee gardent les places 0 et 1 : elles sont hors du
   cercle et ne tournent pas. */
var PLACE = MURS.map(function(_, i){ return i; });
function poserOrdre(){
  MURS.forEach(function(m, i){
    var d = S('mur-' + m.id);
    if(d) d.style.order = PLACE[i];
  });
}
poserOrdre();
/* range les six murs du cercle a partir de `ancre`, qui prend `place`,
   les suivants dans le sens donne. */
function tournerCercle(ancre, place, sens){
  var n = FACES.length, pos = FACES.indexOf(ancre);
  if(pos < 0) return;
  for(var k = 0; k < n; k++){
    PLACE[FACES[(pos + sens * k + n * n) % n]] = place + sens * k;
  }
  poserOrdre();
}

/* ------------------ la fenetre et sa vue ------------------
   Une image « percee » : l'arche est un vrai trou (alpha 0) et la vue
   passe DERRIERE en calque plein. Aucun clip-path — la « fenetre de
   merde » de la v1 de la maquette.
   LE CADRAGE EST INSTALLE PAR LA JOUEUSE (« autant laisser le joueur
   l'installer a sa guise ») : glisser + pincer jusqu'a 4x, borne pour
   toujours couvrir l'arche. Memorise PAR VILLE, pas par mur : c'est le
   pays qu'on voit, et il change avec le voyage. */
function cadrageDe(ref){
  if(!CADRAGE[ref]) CADRAGE[ref] = {z:1, ox:0, oy:0};
  return CADRAGE[ref];
}
function appliquerVue(id){
  var c = cadrageDe(VUE_NOM ? VUE_REF : "-"), v = S('vue-' + id);
  if(!v) return;
  var m = (c.z - 1) / 2 * 100;
  c.ox = Math.max(-m, Math.min(m, c.ox));
  c.oy = Math.max(-m, Math.min(m, c.oy));
  v.style.width  = (c.z * 100) + '%';
  v.style.height = (c.z * 100) + '%';
  v.style.left   = (-(c.z - 1) / 2 * 100 + c.ox) + '%';
  v.style.top    = (-(c.z - 1) / 2 * 100 + c.oy) + '%';
}
function appliquerToutesLesVues(){
  Object.keys(ARCHES).forEach(function(id){ appliquerVue(id); });
}
var VUE_REF = "-";

Object.keys(ARCHES).forEach(function(id){
  var f = S('dedans-' + id); if(!f) return;
  var A = ARCHES[id];
  var cadre = document.createElement('div');
  cadre.id = 'cadre-' + id;
  cadre.style.cssText = 'position:absolute;left:' + A[0] + '%;top:' + A[1] + '%;width:' + A[2]
                      + '%;height:' + A[3] + '%;overflow:hidden;z-index:0';
  var v = document.createElement('img');
  v.id = 'vue-' + id; v.alt = '';
  v.style.cssText = 'position:absolute;object-fit:cover;object-position:center;'
                  + 'width:100%;height:100%;left:0;top:0';
  cadre.appendChild(v);
  f.insertBefore(cadre, f.firstChild);
  var fm = f.querySelector('img.fondmur');
  fm.style.position = 'relative'; fm.style.zIndex = '1';

  var z = document.createElement('div'); z.className = 'fenZone';
  z.style.cssText = 'position:absolute;left:' + A[0] + '%;top:' + A[1] + '%;width:' + A[2]
                  + '%;height:' + A[3] + '%;z-index:3;touch-action:none;cursor:grab';
  f.appendChild(z);

  var deb = null, pz = null, bouge = false;
  z.addEventListener('touchstart', function(ev){
    ev.stopPropagation();
    var c = cadrageDe(VUE_REF); bouge = false;
    if(ev.touches.length === 2){
      ev.preventDefault();
      pz = {d:Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY), z:c.z};
    } else {
      deb = {x:ev.touches[0].clientX, y:ev.touches[0].clientY, ox:c.ox, oy:c.oy};
    }
  }, {passive:false});
  z.addEventListener('touchmove', function(ev){
    ev.stopPropagation(); ev.preventDefault();
    var c = cadrageDe(VUE_REF);
    if(pz && ev.touches.length === 2){
      bouge = true;
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      c.z = Math.max(1, Math.min(4, pz.z * d / pz.d));
      appliquerToutesLesVues(); return;
    }
    if(!deb) return;
    var b = S('cadre-' + id);
    var L = b.offsetWidth * ZOOM, H = b.offsetHeight * ZOOM;
    var dx = (ev.touches[0].clientX - deb.x), dy = (ev.touches[0].clientY - deb.y);
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) bouge = true;
    c.ox = deb.ox + dx / L * 100;
    c.oy = deb.oy + dy / H * 100;
    appliquerToutesLesVues();
  }, {passive:false});
  z.addEventListener('touchend', function(ev){
    ev.stopPropagation();
    deb = null; pz = null;
    if(!bouge) ouvrirGrandeVue(); else enregistrer();
  }, {passive:false});
  z.addEventListener('mousedown', function(ev){
    ev.stopPropagation(); ev.preventDefault();
    var c = cadrageDe(VUE_REF); bouge = false;
    var d0 = {x:ev.clientX, y:ev.clientY, ox:c.ox, oy:c.oy};
    function mv(e2){
      var b = S('cadre-' + id);
      var L = b.offsetWidth * ZOOM, H = b.offsetHeight * ZOOM;
      var dx = e2.clientX - d0.x, dy = e2.clientY - d0.y;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) bouge = true;
      c.ox = d0.ox + dx / L * 100; c.oy = d0.oy + dy / H * 100;
      appliquerToutesLesVues();
    }
    function up(){
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      if(!bouge) ouvrirGrandeVue(); else enregistrer();
    }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
  z.addEventListener('wheel', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    var c = cadrageDe(VUE_REF);
    c.z = Math.max(1, Math.min(4, c.z + (ev.deltaY < 0 ? 0.12 : -0.12)));
    appliquerToutesLesVues(); enregistrer();
  }, {passive:false});
});

function ouvrirGrandeVue(){
  if(!VUE_IMG) return;
  S('gvImg').src = VUE_IMG;
  S('gvNom').textContent = VUE_NOM;
  S('gvSous').textContent = M('taVue') + (VUE_NAT ? ' — ' + VUE_NAT : '');
  S('grandeVue').classList.add('on');
}
S('grandeVue').addEventListener('click', function(){ this.classList.remove('on'); });

/* ------------------ les points de navigation ------------------ */
var pts = S('points');
MURS.forEach(function(m, i){
  var p = document.createElement('i');
  p.style.cursor = 'pointer'; p.style.margin = '0 3px'; p.style.padding = '6px';
  p.style.backgroundClip = 'content-box'; p.title = nomMurDe(m.id);
  p.onclick = function(ev){ ev.stopPropagation(); aller(i); };

/* Safari a ses propres evenements de geste (gesturestart/change/end) qui
   declenchent le zoom de la PAGE. On les refuse sur la scene seulement :
   ailleurs, le zoom du navigateur doit rester disponible. */
['gesturestart','gesturechange','gestureend'].forEach(function(n){
  sc.addEventListener(n, function(ev){ ev.preventDefault(); }, false);
});
document.addEventListener('touchmove', function(ev){
  if(ev.touches.length > 1 && ev.target.closest('#scene')) ev.preventDefault();
}, {passive:false});

function suivant(sens){
  var i = FACES.indexOf(mur);
  if(i < 0) return FACES[0];               /* on est sur une vue d'arrivee */
  return FACES[(i + sens + FACES.length) % FACES.length];
}
/* Tout saut de plus d'un mur est instantane : sinon la scene traverse les
   huit murs avec l'animation — « tout saute et ca ramene en arriere a
   toute allure » (Blandine, v15 de la maquette). */
function allerBrut(i){
  var cible = (i + MURS.length) % MURS.length;
  /* un pas d'un seul cran DANS le cercle : on remet le ruban dans une
     forme ou les deux murs se touchent, sans que rien ne bouge a
     l'ecran, puis on laisse l'animation faire son cran. */
  var n = FACES.length, pc = FACES.indexOf(mur), pt = FACES.indexOf(cible);
  if(pc >= 0 && pt >= 0){
    var ecart = (pt - pc + n) % n;
    if((ecart === 1 || ecart === n - 1) && Math.abs(PLACE[cible] - PLACE[mur]) > 1){
      var avant = (ecart === 1);
      sc.style.transition = 'none';
      tournerCercle(mur, avant ? 2 : (2 + n - 1), avant ? 1 : -1);
      sc.style.transform = 'translateX(' + (-PLACE[mur] * 100) + 'vw)';
      void sc.offsetWidth;
      sc.style.transition = '';
    }
  }
  var saut = Math.abs(PLACE[cible] - PLACE[mur]) > 1;
  if(saut) sc.style.transition = 'none';
  mur = cible;
  sc.style.transform = 'translateX(' + (-PLACE[mur] * 100) + 'vw)';
  if(saut){ void sc.offsetWidth; sc.style.transition = ''; }
  S('nomMur').textContent = nomMurDe(MURS[mur].id);
  [].forEach.call(pts.children, function(p, j){ p.classList.toggle('on', j === mur); });
}
/* le zoom se remet a 1 quand on change de mur : chaque mur a son cadrage */
function aller(i){ ZOOM = 1; ZX = 0; ZY = 0; allerBrut(i); appliquerZoom(); }

var sx = null, sy = null;
function surUnGeste(t){
  return t.closest('.obj') || t.closest('#reserve') || t.closest('#grandeVue')
      || t.closest('.fenZone') || t.closest('#zoomBarre') || t.closest('#tailleBarre')
      || t.closest('#haut');
}
document.addEventListener('touchstart', function(e){
  if(surUnGeste(e.target)) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(sx === null) return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if(ZOOM > 1) return;      /* zoomee, le glissement sert a se deplacer */
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) aller(suivant(dx < 0 ? 1 : -1));
}, {passive:true});
var mx = null;
document.addEventListener('mousedown', function(e){
  if(surUnGeste(e.target)) return;
  mx = e.clientX;
});
document.addEventListener('mouseup', function(e){
  if(mx === null) return; var dx = e.clientX - mx; mx = null;
  if(ZOOM > 1) return;
  if(Math.abs(dx) > 60) aller(suivant(dx < 0 ? 1 : -1));
});

/* ------------------ la reserve et la pose ------------------ */
var rl = S('resListe');
function construireReserve(){
  rl.innerHTML = '';
  S('resVide').textContent = M('vide');
  S('resVide').classList.toggle('on', OBJETS.length === 0);
  S('resTitre').textContent = OBJETS.length ? M('consigne') : '';
  OBJETS.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'resObj'; b.id = 'res-' + o.ref; b.type = 'button';
    b.title = o.nom;
    var im = document.createElement('img'); im.alt = ''; im.src = img(o.pose);
    /* si la vue posee n'existe pas encore a la racine, on retombe sur
       l'image de collection : la vignette n'est jamais vide. */
    im.onerror = function(){ if(o.repli && im.src !== img(o.repli)) im.src = img(o.repli); };
    b.appendChild(im);
    b.onclick = function(){
      if(POSES[o.ref]){ retirer(o.ref); aide(o.nom + ' — ' + M('range')); enregistrer(); return; }
      var n = 0, k; for(k in POSES){ if(POSES[k].mur === mur) n++; }
      if(MURS[mur].arrivee){ aller(2); aide(M('avance')); }
      var bx = (MURS[mur].id === "fond" ? 22 : 34) + (n % 4) * 13;
      var by = (MURS[mur].id === "fond" ? 62 : 42) + Math.floor(n / 4) * 11;
      if(by > 80) by = 80;
      poser(o.ref, mur, bx, by, o.gros || 22);
      aide(o.nom + ' — ' + M('gestes'));
      enregistrer();
    };
    rl.appendChild(b);
  });
  /* REGLE DU SCROLL RESET : tout panneau `overflow:auto` repart de son
     debut a chaque ouverture. La reserve defile horizontalement. */
  rl.scrollLeft = 0; rl.scrollTop = 0;
}

/* LA FENETRE EST INVIOLABLE (Blandine : « on ne devrait rien pouvoir
   inserer sur ou dans la fenetre »). Vrai seulement DANS l'arche du mur
   du fond : la v5 de la maquette avait cette logique inversee et
   repoussait les objets partout, porte comprise. */
var FENETRE = {left:31, right:69, top:19, bottom:53};
function dansFenetre(m, p){
  return MURS[m].id === "fond"
      && p.x > FENETRE.left && p.x < FENETRE.right
      && p.y > FENETRE.top  && p.y < FENETRE.bottom;
}
function repousser(p){
  var dg = Math.abs(p.x - FENETRE.left), dd = Math.abs(FENETRE.right - p.x);
  p.x = (dg < dd) ? FENETRE.left - 6 : FENETRE.right + 6;
  aide(M('fenetre'));
}
/* LE JUMEAU. L'objet vit sur le mur ou il a ete pose (c'est lui qu'on
   saisit) et une COPIE non saisissable est peinte sur l'autre vue du meme
   mur, a la place calculee par l'homographie et avec la vue de trois
   quarts quand elle existe. On ne stocke jamais le jumeau : il se
   recalcule. C'est ce qui permettra d'ajouter des angles plus tard sans
   toucher aux donnees deja enregistrees. */
function majJumeau(r){
  var p = POSES[r]; if(!p) return;
  var idOwn = MURS[p.mur].id, idJ = jumeauDe(idOwn);
  var vieux = S('jum-' + r); if(vieux) vieux.remove();
  if(!idJ) return;
  var q = projeter(idOwn, idJ, p.x, p.y); if(!q) return;
  /* la largeur suit la perspective : on projette les deux bords et on
     mesure ce qui reste entre eux. Un objet qui s'eloigne rapetit. */
  var g = projeter(idOwn, idJ, p.x - p.l / 2, p.y);
  var d = projeter(idOwn, idJ, p.x + p.l / 2, p.y);
  var l = (g && d) ? Math.abs(d.x - g.x) : p.l;
  l = Math.max(5, Math.min(70, l));
  var hote = S('dedans-' + idJ); if(!hote) return;
  var e = document.createElement('div');
  e.className = 'obj jumeau'; e.id = 'jum-' + r;
  e.style.pointerEvents = 'none';
  var im = document.createElement('img'); im.alt = '';
  im.src = imageObjet(r, idJ);
  var o = objetDe(r);
  im.onerror = function(){ if(o && o.repli && im.src !== img(o.repli)) im.src = img(o.repli); };
  im.style.transform = p.mir ? 'scaleX(-1)' : '';
  e.appendChild(im);
  e.style.width = l + '%'; e.style.height = 'auto';
  e.style.left = (q.x - l / 2) + '%';
  e.style.top = q.y + '%';
  e.style.transform = 'translateY(-50%)';
  hote.appendChild(e);
}
function retirerJumeau(r){ var e = S('jum-' + r); if(e) e.remove(); }

function poser(r, m, x, y, larg, mir){
  POSES[r] = {mur:m, x:x, y:y, l:larg, mir:!!mir};
  var d = document.createElement('div'); d.className = 'obj'; d.id = 'obj-' + r;
  var im = document.createElement('img'); im.alt = ''; im.src = imageObjet(r, MURS[m].id);
  var o = objetDe(r);
  im.onerror = function(){ if(o && o.repli && im.src !== img(o.repli)) im.src = img(o.repli); };
  d.appendChild(im);
  S('dedans-' + MURS[m].id).appendChild(d);
  appliquer(r); brancher(r);
  var v = S('res-' + r); if(v) v.classList.add('pose');
}
function retirer(r){
  if(OBJ_ACTIF === r) cacherTaille();
  retirerJumeau(r);
  var e = S('obj-' + r); if(e) e.remove();
  delete POSES[r];
  var v = S('res-' + r); if(v) v.classList.remove('pose');
}
function borner(p){
  p.x = Math.max(3, Math.min(97, p.x));
  p.y = Math.max(3, Math.min(97, p.y));
}
function appliquer(r){
  var p = POSES[r], e = S('obj-' + r);
  if(!p || !e) return;
  borner(p);
  e.style.width = p.l + '%';       /* taille en % DU MUR, pas de l'ecran */
  e.style.height = 'auto';
  e.style.left = (p.x - p.l / 2) + '%';
  e.style.top = p.y + '%';
  e.style.transform = 'translateY(-50%)';
  var im = e.querySelector('img');
  im.style.transform = p.mir ? 'scaleX(-1)' : '';
  var voulue = imageObjet(r, MURS[p.mur].id);
  if(voulue && im.getAttribute('src') !== voulue) im.src = voulue;
  majJumeau(r);
}
function transferer(r, sens){
  var p = POSES[r], e = S('obj-' + r);
  var i = FACES.indexOf(p.mur); if(i < 0) i = 0;
  var ni = FACES[(i + sens + FACES.length) % FACES.length];
  retirerJumeau(r);       /* il appartenait a l'ancien mur */
  p.mur = ni;
  S('dedans-' + MURS[ni].id).appendChild(e);
  p.x = sens > 0 ? 16 : 84;        /* il entre par le bord oppose */
  aller(ni); appliquer(r); enregistrer();
  aide('« ' + nomMurDe(MURS[ni].id) + ' »');
}
function surLaReserve(y){
  var res = S('reserve');
  return y >= (window.innerHeight - res.offsetHeight);
}
function brancher(r){
  var e = S('obj-' + r), p = POSES[r];
  var t0 = 0, deb = null, pincement = null;
  var dernier = null, bordT = null, bordCote = 0;
  function quitterBord(){ if(bordT){ clearTimeout(bordT); bordT = null; } bordCote = 0; }
  function gererBord(x){
    var c = x < window.innerWidth * 0.10 ? -1 : (x > window.innerWidth * 0.90 ? 1 : 0);
    if(c === 0){ quitterBord(); return; }
    if(c === bordCote) return;
    quitterBord(); bordCote = c;
    aide(M('tenir'));
    bordT = setTimeout(function(){ bordT = null; bordCote = 0; transferer(r, c); }, 600);
  }
  e.addEventListener('touchstart', function(ev){
    if(ev.touches.length === 2){
      ev.preventDefault();
      pincement = {d:Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                                ev.touches[0].clientY - ev.touches[1].clientY), l:p.l};
      return;
    }
    var q = ev.touches[0]; deb = {x:q.clientX, y:q.clientY, px:p.x, py:p.y};
    e.classList.add('tenu'); montrerTaille(r);
    var t = Date.now();
    /* ecouteur NON passif : le double-toucher (miroir) est le meme geste
       que le zoom-au-double-tap de Safari, qui zoomait la page par-dessus. */
    if(t - t0 < 320){ ev.preventDefault(); p.mir = !p.mir; appliquer(r); enregistrer(); }
    t0 = t;
  }, {passive:false});
  e.addEventListener('touchmove', function(ev){
    ev.preventDefault();
    if(pincement && ev.touches.length === 2){
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      p.l = Math.max(8, Math.min(60, pincement.l * d / pincement.d)); appliquer(r); return;
    }
    if(!deb) return;
    var q = ev.touches[0];
    dernier = {x:q.clientX, y:q.clientY};
    /* les positions sont en % DU MUR : le deplacement du doigt se convertit
       avec la taille du mur AFFICHE, zoom compris, sinon l'objet ne suit pas. */
    var b = S('dedans-' + MURS[p.mur].id);
    var bw = (b ? b.offsetWidth : window.innerWidth) * ZOOM;
    var bh = (b ? b.offsetHeight : window.innerHeight) * ZOOM;
    p.x = deb.px + (q.clientX - deb.x) / bw * 100;
    p.y = deb.py + (q.clientY - deb.y) / bh * 100;
    appliquer(r);
    gererBord(q.clientX);
  }, {passive:false});
  e.addEventListener('touchend', function(){
    quitterBord();
    deb = null; pincement = null; e.classList.remove('tenu');
    if(dernier && surLaReserve(dernier.y)){
      dernier = null; retirer(r); aide(M('range')); enregistrer();
      return;                       /* l'objet n'existe plus : on s'arrete la */
    }
    dernier = null;
    if(POSES[r] && dansFenetre(POSES[r].mur, p)){ repousser(p); appliquer(r); }
    enregistrer();
  }, {passive:true});
  e.addEventListener('mousedown', function(ev){
    ev.preventDefault();
    deb = {x:ev.clientX, y:ev.clientY, px:p.x, py:p.y}; e.classList.add('tenu');
    montrerTaille(r);
    var t = Date.now(); if(t - t0 < 320){ p.mir = !p.mir; appliquer(r); } t0 = t;
    function mv(e2){
      var b = S('dedans-' + MURS[p.mur].id);
      var bw = (b ? b.offsetWidth : window.innerWidth) * ZOOM;
      var bh = (b ? b.offsetHeight : window.innerHeight) * ZOOM;
      p.x = deb.px + (e2.clientX - deb.x) / bw * 100;
      p.y = deb.py + (e2.clientY - deb.y) / bh * 100;
      appliquer(r); gererBord(e2.clientX);
    }
    function up(ev2){
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      e.classList.remove('tenu'); quitterBord();
      if(ev2 && surLaReserve(ev2.clientY)){ retirer(r); aide(M('range')); enregistrer(); return; }
      if(POSES[r] && dansFenetre(POSES[r].mur, p)){ repousser(p); appliquer(r); }
      enregistrer();
    }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
  e.addEventListener('wheel', function(ev){
    ev.preventDefault();
    p.l = Math.max(8, Math.min(60, p.l + (ev.deltaY < 0 ? 1.5 : -1.5)));
    appliquer(r); enregistrer();
  });
}

/* ------------------ le zoom de la piece ------------------
   Le zoom du NAVIGATEUR reste bloque sur la scene (il deregle tout) ;
   celui-ci est le notre : il agrandit le calque « dedans » du mur, objets
   compris, puisqu'ils sont dedans et places en %. Le decalage est borne
   par (z-1)/(2z) : avec (z-1)/2 on sortait du mur en plein noir. */
var ZOOM = 1, ZX = 0, ZY = 0, ZMAX = 3;
function bornerZoom(){
  var m = (ZOOM - 1) / (2 * ZOOM) * 100;
  ZX = Math.max(-m, Math.min(m, ZX));
  ZY = Math.max(-m, Math.min(m, ZY));
  if(ZOOM <= 1){ ZX = 0; ZY = 0; }
}
function appliquerZoom(){
  bornerZoom();
  var l = document.querySelectorAll('.mur > .dedans');
  for(var i = 0; i < l.length; i++){
    l[i].style.transform = 'translate(-50%,-50%) scale(' + ZOOM + ') translate(' + ZX + '%,' + ZY + '%)';
  }
  S('zVal').textContent = (Math.round(ZOOM * 10) / 10) + '\u00D7';
}
function zoomer(f){
  var av = ZOOM;
  ZOOM = Math.max(1, Math.min(ZMAX, ZOOM * f));
  if(ZOOM === av) return;
  appliquerZoom();
}
S('zPlus').onclick  = function(){ zoomer(1.4); if(ZOOM > 1) aide(M('deplacer')); };
S('zMoins').onclick = function(){ zoomer(1 / 1.4); };
(function(){
  var pz = null, gd = null;
  document.addEventListener('touchstart', function(ev){
    if(surUnGeste(ev.target)) return;
    if(ev.touches.length === 2){
      pz = {d:Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY), z:ZOOM};
    } else if(ZOOM > 1){
      gd = {x:ev.touches[0].clientX, y:ev.touches[0].clientY, zx:ZX, zy:ZY};
    }
  }, {passive:false});
  document.addEventListener('touchmove', function(ev){
    if(pz && ev.touches.length === 2){
      ev.preventDefault();
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      ZOOM = Math.max(1, Math.min(ZMAX, pz.z * d / pz.d)); appliquerZoom(); return;
    }
    if(gd && ev.touches.length === 1 && ZOOM > 1){
      ev.preventDefault();
      ZX = gd.zx + (ev.touches[0].clientX - gd.x) / window.innerWidth * 100 / ZOOM;
      ZY = gd.zy + (ev.touches[0].clientY - gd.y) / window.innerHeight * 100 / ZOOM;
      appliquerZoom();
    }
  }, {passive:false});
  document.addEventListener('touchend', function(){ pz = null; gd = null; }, {passive:true});
})();

/* ------------------ les boutons de taille ------------------ */
var OBJ_ACTIF = null;
function montrerTaille(r){ OBJ_ACTIF = r; S('tailleBarre').classList.add('on'); }
function cacherTaille(){ OBJ_ACTIF = null; S('tailleBarre').classList.remove('on'); }
function retailler(d){
  if(!OBJ_ACTIF || !POSES[OBJ_ACTIF]){ cacherTaille(); return; }
  var p = POSES[OBJ_ACTIF];
  p.l = Math.max(8, Math.min(60, p.l + d));
  appliquer(OBJ_ACTIF); enregistrer();
}
S('tPlus').onclick  = function(){ retailler(3); };
S('tMoins').onclick = function(){ retailler(-3); };

var aideT = null;
function aide(txt){
  var a = S('aide'); a.textContent = txt; a.classList.add('on');
  if(aideT) clearTimeout(aideT);
  aideT = setTimeout(function(){ a.classList.remove('on'); }, 3800);
}

/* ------------------ un format mesure PAR MUR ------------------
   La v17 de la maquette mesurait UNE image et imposait son format aux
   autres : « la porte a retreci au seche-linge ». Et le mur ENTIER doit
   tenir entre le bandeau et la reserve, sinon on ne peut pas poser a cote
   de la porte, ni devant. Le zoom sert a s'approcher. */
/* ⚠️ AJOUT DU 14/08 — LE FORMAT DE REPLI.
   Jusqu'ici `FORMAT` n'etait rempli que par le `onload` de l'image. Une
   image absente (la porte du fond, le 12/08) laissait donc `FORMAT[id]`
   vide, `calerMurs` sortait par le `return`, et le `.dedans` gardait une
   taille NULLE. Or les objets sont positionnes en % DE CE CONTENEUR :
   pourcentage de zero = zero. Tous les objets s'empilaient en un point,
   invisibles. Desormais chaque mur nait avec le format 2:3 de la piece ;
   la vraie mesure le remplace des que l'image arrive. Un mur sans image
   est un cadre vide, plus un trou noir. */
var REPLI = {w:1024, h:1536};
var FORMAT = {};
function calerMurs(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var haut = S('haut').offsetHeight;
  var res  = S('reserve').offsetHeight;
  var dispoH = Math.max(120, vh - haut - res);
  var centre = haut + dispoH / 2;
  MURS.forEach(function(m){
    var f = FORMAT[m.id] || REPLI;
    var d = S('dedans-' + m.id); if(!d) return;
    var k = Math.min(vw / f.w, dispoH / f.h);
    d.style.width  = (f.w * k) + 'px';
    d.style.height = (f.h * k) + 'px';
    d.style.top    = centre + 'px';
  });
  appliquerZoom();
}
window.addEventListener('resize', calerMurs);

/* ⚠️ AJOUT DU 14/08 — CHAQUE MUR CHARGE SEUL.
   Un mur qui echoue ne doit faire tomber que lui. Le `try` isole la
   boucle et le `onerror` NOMME le fichier manquant a l'ecran, au lieu
   du silence noir du 12/08. */
var MANQUANTS = [];
function chargerMurs(){
  MURS.forEach(function(m){
    try{
      var src = img(m.f);
      var d = S('dedans-' + m.id); if(!d) return;
      var e = d.querySelector('img.fondmur'); if(!e) return;
      e.src = src;
      var t = new Image();
      t.onload = function(){
        FORMAT[m.id] = {w:t.naturalWidth, h:t.naturalHeight};
        calerMurs();
      };
      t.onerror = function(){
        MANQUANTS.push(m.f);
        signaler('Image absente : ' + MANQUANTS.join(', '));
        calerMurs();                 /* le mur garde son format de repli */
      };
      t.src = src;
    }catch(err){
      signaler('Mur « ' + m.id + " » : " + err.message);
    }
  });
}

/* ------------------ le dialogue avec lingo.html ------------------ */
var minuterie = null;
function enregistrer(){
  if(!pret) return;
  if(minuterie) clearTimeout(minuterie);
  /* on n'ecrit pas a chaque pixel : un objet glisse produirait des
     centaines de messages. Une pause de 400 ms suffit au doigt. */
  minuterie = setTimeout(function(){
    minuterie = null;
    try{
      parent.postMessage({t:"linguae-sellerie-poses", piece:PIECE,
                          poses:POSES, vues:CADRAGE}, "*");
    }catch(e){}
  }, 400);
}
function fermer(){
  if(minuterie){ clearTimeout(minuterie); minuterie = null;
    try{ parent.postMessage({t:"linguae-sellerie-poses", piece:PIECE,
                             poses:POSES, vues:CADRAGE}, "*"); }catch(e){}
  }
  try{ parent.postMessage({t:"linguae-fermer-sellerie"}, "*"); }catch(e){}
}
S('bRetour').addEventListener('click', fermer);

function installer(d){
  LANGUE = d.l || "fr";
  VER    = d.ver || "";
  PREF   = d.prefixe || "";
  PIECE  = d.piece || "classique";
  OBJETS = d.objets || [];
  POSES  = {};
  CADRAGE = d.vues ? JSON.parse(JSON.stringify(d.vues)) : {};
  VUE_IMG = d.vue && d.vue.img ? d.vue.img : "";
  VUE_NOM = d.vue && d.vue.nom ? d.vue.nom : "";
  VUE_NAT = d.vue && d.vue.nation ? d.vue.nation : "";
  VUE_REF = d.vue && d.vue.ref ? d.vue.ref : "-";

  S('titre').textContent = M('titre');
  chargerMurs();
  construireReserve();

  /* la vue du pays derriere les arches */
  Object.keys(ARCHES).forEach(function(id){
    var v = S('vue-' + id); if(v) v.src = VUE_IMG || "";
  });
  appliquerToutesLesVues();

  /* l'amenagement enregistre. La sellerie s'ouvre VIDE quand il n'y a
     rien : les objets poses d'office etaient « les selles par terre »
     que Blandine retrouvait a chaque ouverture. */
  var enr = d.poses || {};
  Object.keys(enr).forEach(function(r){
    var p = enr[r], o = objetDe(r);
    if(!o || !p) return;                       /* objet inconnu : on ignore */
    var m = (typeof p.mur === "number" && MURS[p.mur]) ? p.mur : 2;
    if(MURS[m].arrivee) m = 2;                 /* on ne pose pas sur une arrivee */
    poser(r, m, p.x, p.y, p.l, p.mir);
  });

  pret = true;
  aller(0);                                    /* on arrive de loin */
}

window.addEventListener('message', function(ev){
  var d = ev.data || {};
  if(d.t === "linguae-sellerie") installer(d);
  if(d.t === "hype-lang" && d.l){ LANGUE = d.l; S('titre').textContent = M('titre');
    S('nomMur').textContent = nomMurDe(MURS[mur].id); construireReserve(); }
});
try{ parent.postMessage({t:"linguae-sellerie-prete"}, "*"); }catch(e){}
