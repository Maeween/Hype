<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hype Linguae · le globe du voyage</title>
<style>
:root{ --noir:#060709; --anthracite:#111417; --turq:#20D9F5; --blanc:#F4F7FA; --or:#D4AF37; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--noir);color:var(--blanc);
  font-family:'Montserrat',-apple-system,system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#titre{position:fixed;left:0;right:0;top:0;padding:18px 20px 0;text-align:center;
  pointer-events:none;z-index:4}
#titre b{display:block;font-family:'Cinzel',Georgia,serif;font-size:17px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:600}
#titre i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#7C8894;margin-top:7px}
#fiche{position:fixed;left:14px;right:14px;bottom:14px;z-index:6;
  background:linear-gradient(165deg,rgba(17,20,23,.94),rgba(6,7,9,.97));
  border:1px solid rgba(32,217,245,.22);border-radius:18px;padding:16px 18px 18px;
  transform:translateY(150%);transition:transform .34s cubic-bezier(.22,1,.36,1)}
#fiche.on{transform:none}
#fLieu{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--turq);margin:0}
#fV{font-family:'Cinzel',Georgia,serif;font-size:22px;margin:6px 0 2px;letter-spacing:.04em}
#fCh{font-size:13px;color:#9AA6B2;margin:0 0 10px}
#fEtat{display:flex;gap:7px;align-items:center;font-size:11px;color:#7C8894;margin:0 0 13px}
#fEtat s{width:6px;height:6px;border-radius:50%;background:#39424C;text-decoration:none}
#fEtat.faite s{background:var(--or)}
#fEtat.ouverte s{background:var(--turq)}
#fGo{width:100%;padding:14px;border:0;border-radius:13px;font:inherit;font-size:12px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#04202A;
  background:linear-gradient(120deg,var(--turq),#7FE9F8);cursor:pointer}
#fGo[disabled]{background:rgba(255,255,255,.09);color:#5E6975}
#fX{position:absolute;top:10px;right:12px;width:32px;height:32px;border:0;border-radius:50%;
  background:rgba(255,255,255,.07);color:#9AA6B2;font-size:17px;cursor:pointer}
#leg{position:fixed;left:0;right:0;bottom:0;padding:0 20px 18px;text-align:center;z-index:3;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5E6975;pointer-events:none}
#leg span{margin:0 9px;white-space:nowrap}
#leg s{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;
  text-decoration:none;vertical-align:1px}
.lFaite s{background:var(--or)} .lOuv s{background:var(--turq)} .lFerm s{background:#39424C}
#compte{position:fixed;top:0;right:0;padding:20px 20px 0;z-index:4;text-align:right;
  font-size:10px;letter-spacing:.18em;color:#5E6975;pointer-events:none}
#compte b{display:block;font-family:'Cinzel',Georgia,serif;font-size:20px;color:var(--or);
  letter-spacing:0}
</style></head><body>
<div id="scene"><canvas id="c"></canvas></div>
<div id="titre"><b>Le tour du monde</b><i id="depart">au départ de Paris</i></div>
<div id="compte"><b id="nFaites">0</b>étapes</div>

</div>

</div>

  var g = cx.createRadialGradient(cxx, cyy, R*0.2, cxx, cyy, R*1.5);
  g.addColorStop(0,"rgba(32,217,245,.10)"); g.addColorStop(1,"rgba(6,7,9,0)");
  cx.fillStyle=g; cx.beginPath(); cx.arc(cxx,cyy,R*1.5,0,6.2832); cx.fill();

  var s = cx.createRadialGradient(cxx-R*0.35, cyy-R*0.4, R*0.1, cxx, cyy, R);
  s.addColorStop(0,"#141C26"); s.addColorStop(1,"#080B11");
  cx.fillStyle=s; cx.beginPath(); cx.arc(cxx,cyy,R,0,6.2832); cx.fill();

  /* la grille : méridiens et parallèles, très discrets */
  cx.strokeStyle="rgba(32,217,245,.07)"; cx.lineWidth=1;
  var i,j,p,q,prem;
  for(i=-80;i<=80;i+=20){
    cx.beginPath(); prem=true;
    for(j=-180;j<=180;j+=4){ p=proj(i,j); if(!p){prem=true;continue;}
      if(prem){cx.moveTo(p.x,p.y);prem=false;} else cx.lineTo(p.x,p.y); }
    cx.stroke();
  }
  for(j=-180;j<180;j+=20){
    cx.beginPath(); prem=true;
    for(i=-88;i<=88;i+=3){ p=proj(i,j); if(!p){prem=true;continue;}
      if(prem){cx.moveTo(p.x,p.y);prem=false;} else cx.lineTo(p.x,p.y); }
    cx.stroke();
  }

  /* Les terres, en points.
     ⚠️ La grille source est régulière en degrés : vers les pôles, les
     méridiens se resserrent et les points forment des arcs moirés qui
     ressemblent à un défaut d'affichage. On éclaircit donc la maille en
     fonction de la latitude, et on coupe au-delà du cercle arctique
     dense — aucune destination du voyage n'est concernée. */
  var r = Math.max(0.9, R*0.0075), al, pas;
  for(i=0;i<LAND.length;i+=2){
    al = Math.abs(LAND[i]);
    if(al > 78) continue;
    pas = al > 70 ? 3 : (al > 58 ? 2 : 1);
    if(pas > 1 && Math.round(LAND[i+1]/2.5) % pas !== 0) continue;
    p = proj(LAND[i], LAND[i+1]);
    if(!p) continue;
    cx.fillStyle = "rgba(150,178,196," + (0.16 + p.z*0.34).toFixed(3) + ")";
    cx.beginPath(); cx.arc(p.x,p.y,r,0,6.2832); cx.fill();
  }

  /* les lignes du voyage : depuis l'écurie vers chaque étape faite */
  DEST.forEach(function(d){
    if(!FAITES[d.ref]) return;
    var pts = arc(DEPART, d, 48), coupe=true;
    cx.strokeStyle="rgba(212,175,55,.40)"; cx.lineWidth=1.2;
    cx.beginPath();
    pts.forEach(function(p){
      if(!p){ coupe=true; return; }
      if(coupe){ cx.moveTo(p.x,p.y); coupe=false; } else cx.lineTo(p.x,p.y);
    });
    cx.stroke();
  });

  /* le point de départ */
  p = proj(DEPART.lat, DEPART.lng);
  if(p){
    cx.strokeStyle="rgba(244,247,250,.7)"; cx.lineWidth=1.2;
    cx.beginPath(); cx.arc(p.x,p.y,5.5,0,6.2832); cx.stroke();
    cx.fillStyle="rgba(244,247,250,.9)";
    cx.beginPath(); cx.arc(p.x,p.y,1.6,0,6.2832); cx.fill();
  }

  var etiquettes = [];

  /* les destinations. Une étape faite porte une étoile, pas un point :
     c'est la constellation, perdue avec le chemin, qui revient ici. */
  DEST.forEach(function(d){
    var pp = proj(d.lat, d.lng);
    if(!pp) { d._e=null; return; }
    d._e = pp;
    var faite=!!FAITES[d.ref], ouv=!!OUVERTES[d.ref], vis=(d===choisi||d===survol);
    var c = faite ? "212,175,55" : (ouv ? "32,217,245" : "110,124,138");
    var a = faite ? 1 : (ouv ? .95 : .5);
    if(faite){
      cx.save(); cx.translate(pp.x,pp.y); cx.rotate(-Math.PI/2);
      cx.fillStyle="rgba(212,175,55,.95)"; cx.beginPath();
      for(i=0;i<10;i++){
        var ra = (i%2===0) ? 6.4 : 2.5, an = i*Math.PI/5;
        cx[i?"lineTo":"moveTo"](Math.cos(an)*ra, Math.sin(an)*ra);
      }
      cx.closePath(); cx.fill(); cx.restore();
    } else {
      cx.fillStyle="rgba("+c+","+a+")";
      cx.beginPath(); cx.arc(pp.x,pp.y, ouv?4.2:3, 0, 6.2832); cx.fill();
      if(ouv){
        cx.strokeStyle="rgba(32,217,245,.34)"; cx.lineWidth=1;
        cx.beginPath(); cx.arc(pp.x,pp.y,8.5,0,6.2832); cx.stroke();
      }
    }
    if(vis){
      cx.strokeStyle="rgba("+c+",.85)"; cx.lineWidth=1.4;
      cx.beginPath(); cx.arc(pp.x,pp.y,13,0,6.2832); cx.stroke();
    }
    /* le nom : seulement les ouvertes, les faites et celle qu'on touche,
       sinon le globe devient illisible à dix-huit étiquettes */
    if(faite || ouv || vis) etiquettes.push({d:d, p:pp, vis:vis});
  });

  /* Les étiquettes en dernier, et seulement celles qui ne se marchent pas
     dessus : à dix-huit villes dans un rayon de six cents kilomètres, tout
     afficher revient à n'afficher rien. Priorité à celle qu'on touche,
     puis aux étapes faites, puis aux ouvertes. */
  cx.font = "600 10.5px Montserrat, sans-serif";
  etiquettes.sort(function(a,b){
    var pa = a.vis?0:(FAITES[a.d.ref]?1:2), pb = b.vis?0:(FAITES[b.d.ref]?1:2);
    return pa-pb;
  });
  var prises = [];
  etiquettes.forEach(function(e){
    var droite = e.p.x > cxx;
    var l = cx.measureText(e.d.v).width;
    var x = e.p.x + (droite ? -14 : 14);
    var boite = {x1:(droite?x-l:x)-3, y1:e.p.y-9, x2:(droite?x:x+l)+3, y2:e.p.y+9};
    var libre = prises.every(function(b){
      return boite.x2 < b.x1 || boite.x1 > b.x2 || boite.y2 < b.y1 || boite.y1 > b.y2;
    });
    if(!libre && !e.vis) return;
    prises.push(boite);
    cx.textAlign = droite ? "right" : "left";
    cx.fillStyle = "rgba(244,247,250," + (e.vis?.98:.66) + ")";
    if(e.vis){
      cx.fillStyle = "rgba(6,7,9,.72)";
      cx.fillRect(boite.x1, boite.y1, boite.x2-boite.x1, boite.y2-boite.y1);
      cx.fillStyle = "rgba(244,247,250,.98)";
    }
    cx.fillText(e.d.v, x, e.p.y + 3.5);
  });
}

/* ---------- le zoom ---------- */
function zoomer(f, ancre){
  vol = 1;
  var av = ech;
  ech = Math.max(ECH_MIN, Math.min(ECH_MAX, ech*f));
  if(ech !== av){ dimensionner(); dessiner(); }
}

/* ---------- l'état, reçu du parent ---------- */
function appliquerEtat(e){
  if(!e) return;
  FAITES={}; OUVERTES={};
  (e.faites||[]).forEach(function(r){ FAITES[r]=true; });
  (e.ouvertes||[]).forEach(function(r){ OUVERTES[r]=true; });
  if(e.depart && typeof e.depart.lat==="number"){
    DEPART = {nom:e.depart.nom||"ton écurie", lat:e.depart.lat, lng:e.depart.lng};
  }
  document.getElementById("depart").textContent = "au départ de " + DEPART.nom;
  document.getElementById("nFaites").textContent = Object.keys(FAITES).length;
  dessiner();
}
window.addEventListener("message", function(ev){
  var d = ev.data || {};
  if(d.t === "linguae-etat") appliquerEtat(d);
});

/* ---------- la fiche ---------- */
var fiche=document.getElementById("fiche");
function ouvrirFiche(d){
  choisi = d;
  document.getElementById("fLieu").textContent = d.n;
  document.getElementById("fV").textContent = d.v;
  document.getElementById("fCh").textContent = d.ch;
  var faite=!!FAITES[d.ref], ouv=!!OUVERTES[d.ref];
  var e=document.getElementById("fEtat");
  e.className = faite ? "faite" : (ouv ? "ouverte" : "");
  document.getElementById("fEtatT").textContent =
    faite ? "étape faite · tampon obtenu" : (ouv ? "ouverte" : "pas encore ouverte");
  var b=document.getElementById("fGo");
  b.disabled = !(faite||ouv);
  b.textContent = faite ? "Y retourner" : (ouv ? "Partir" : "À découvrir");
  fiche.classList.add("on");
  dessiner();
}
function fermerFiche(){ choisi=null; fiche.classList.remove("on"); dessiner(); }
document.getElementById("fX").addEventListener("click", fermerFiche);
document.getElementById("fGo").addEventListener("click", function(){
  if(!choisi || this.disabled) return;
  try{ parent.postMessage({t:"linguae-dest", ref:choisi.ref}, "*"); }catch(e){}
});

/* ---------- glisser pour tourner, toucher pour choisir ---------- */
var bas=false, bx=0, by=0, ax=0, ay=0, bouge=false;
function pos(ev){
  var t = ev.touches ? ev.touches[0] : ev, r = cv.getBoundingClientRect();
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function debut(ev){ vol=1; var p=pos(ev); bas=true; bouge=false; bx=p.x; by=p.y; ax=lam; ay=phi; }
function suite(ev){
  if(!bas) return;
  var p=pos(ev), dx=p.x-bx, dy=p.y-by;
  if(Math.abs(dx)+Math.abs(dy) > 5) bouge=true;
  lam = ax - dx/R*0.9;
  phi = Math.max(-1.32, Math.min(1.32, ay + dy/R*0.9));
  dessiner();
  if(ev.cancelable) ev.preventDefault();
}
function fin(ev){
  if(!bas) return; bas=false;
  if(bouge) return;
  /* un tap : la destination visible la plus proche, dans un rayon de 26 px */
  var p = pos(ev.changedTouches ? {touches:ev.changedTouches} : ev), best=null, bd=26*26;
  DEST.forEach(function(d){
    if(!d._e) return;
    var dd = Math.pow(d._e.x-p.x,2) + Math.pow(d._e.y-p.y,2);
    if(dd < bd){ bd=dd; best=d; }
  });
  if(best) ouvrirFiche(best); else fermerFiche();
}
/* pincement à deux doigts */
var ecart0 = 0, ech0 = 1;
function ecartDe(t){
  var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
cv.addEventListener("touchstart", function(ev){
  if(ev.touches.length===2){ vol=1; bas=false; ecart0=ecartDe(ev.touches); ech0=ech; }
}, {passive:true});
cv.addEventListener("touchmove", function(ev){
  if(ev.touches.length===2 && ecart0>0){
    ech = Math.max(ECH_MIN, Math.min(ECH_MAX, ech0 * ecartDe(ev.touches)/ecart0));
    dimensionner(); dessiner();
    if(ev.cancelable) ev.preventDefault();
  }
}, {passive:false});
cv.addEventListener("touchend", function(ev){ if(ev.touches.length<2) ecart0=0; });
cv.addEventListener("wheel", function(ev){
  zoomer(ev.deltaY > 0 ? 0.92 : 1.08);
  if(ev.cancelable) ev.preventDefault();
}, {passive:false});

cv.addEventListener("mousedown",debut); cv.addEventListener("mousemove",suite);
cv.addEventListener("mouseup",fin); cv.addEventListener("mouseleave",function(){bas=false;});
cv.addEventListener("touchstart",debut,{passive:true});
cv.addEventListener("touchmove",suite,{passive:false});
cv.addEventListener("touchend",fin);

/* ---------- le vol d'approche, puis la dérive lente ---------- */
var dernier=0, t0=0;
function boucle(t){
  if(!t0) t0=t;
  if(vol === 0 && !bas && !choisi){
    var f = Math.min(1, (t-t0)/1100);
    /* adouci aux deux bouts : on part et on arrive sans à-coup */
    var e = f<0.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
    ech = 1 + (ECH_ARRIVEE-1)*e;
    dimensionner(); dessiner();
    if(f >= 1) vol = 1;
  } else if(!bas && !choisi){
    if(t-dernier > 33){ lam += derive; dernier=t; dessiner(); }
  }
  requestAnimationFrame(boucle);
}
window.addEventListener("resize", function(){ dimensionner(); dessiner(); });
dimensionner();

/* État de démonstration : le parent l'écrase dès qu'il parle.
   Sans lui, un globe ouvert seul dans un onglet paraîtrait vide. */
appliquerEtat({faites:["newmarket","lambourn","connemara","walsall"],
               ouvertes:["aberystwyth","windsor","kildare","saumur","jerez"],
               depart:{nom:"Paris", lat:48.8566, lng:2.3522}});
requestAnimationFrame(boucle);
</script></body></html>
