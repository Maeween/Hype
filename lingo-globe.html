<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hype Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#04070d;font-family:'Montserrat',-apple-system,system-ui,sans-serif;color:#EAF1F4;overflow-x:hidden}
body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{position:relative;height:102dvh;width:100%;overflow:hidden}
canvas#globe{position:absolute;top:0;left:0;width:100%;height:58dvh;touch-action:none}
.cinzel{font-family:'Cinzel',Georgia,serif}
.glass{background:rgba(13,20,28,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
#bgr{position:absolute;z-index:1;pointer-events:none;background-image:url('images/inline-09.jpg');background-size:100% 100%;background-repeat:no-repeat}
.yw{font-family:'Montserrat',-apple-system,system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:4px;text-transform:uppercase;display:inline-block;color:#F2F8F9}
.yw span{display:inline-block;opacity:0;animation:ywIn 1.3s cubic-bezier(.2,.8,.25,1) forwards;animation-delay:calc(.5s + var(--i)*.22s)}
@keyframes ywIn{0%{opacity:0;transform:scale(2.05);filter:blur(7px);text-shadow:0 0 0 rgba(32,217,245,0)}40%{opacity:1;transform:scale(1.35);filter:blur(0);text-shadow:0 0 20px rgba(120,240,246,.95),0 0 40px rgba(32,217,245,0.82)}100%{opacity:.92;transform:scale(1);filter:blur(0);text-shadow:0 0 12px rgba(32,217,245,0.82),0 2px 6px rgba(10,26,36,0.11)}}
.ywu{display:block;width:36px;height:2px;margin:8px auto 0;border-radius:2px;background:linear-gradient(90deg,rgba(32,217,245,0),#20D9F5,rgba(32,217,245,0));opacity:0;animation:ywuIn .9s 3.6s ease both}
@keyframes ywuIn{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
.glowcast{position:absolute;left:50%;top:53dvh;width:min(64vh,130vw);height:30dvh;transform:translateX(-50%);pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:0;transition:opacity 2.6s ease;background:radial-gradient(ellipse at 50% 0%, rgba(125,238,247,.15) 0%, rgba(125,238,247,.055) 38%, rgba(125,238,247,0) 66%)}
body.idlelit .glowcast{opacity:1;animation:castB 8s 2.6s ease-in-out infinite alternate}
@keyframes castB{from{opacity:.72}to{opacity:1}}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 28px) 18px 6px;z-index:6;text-align:center}
.row1{display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.back{font-size:24px;opacity:.85;width:24px;position:absolute;left:0;top:2px;z-index:2}
.ttl{font-size:16px;letter-spacing:3px}
.cnt{font-size:11px;letter-spacing:1.5px;color:#20D9F5;opacity:.85;margin:3px 0 0 0}
.search{position:absolute;left:50%;transform:translateX(-50%);top:69dvh;width:min(78vw,300px);display:flex;align-items:center;gap:8px;border-radius:13px;padding:9px 13px;z-index:8}
.search input{flex:1;background:none;border:0;outline:0;color:#EAF1F4;font-size:16px;font-family:inherit;min-width:0}
.search input::placeholder{color:rgba(240,246,248,.68);letter-spacing:.2px}
/* ⚠️ Était en position absolue à 59dvh + 56px, calée sous la recherche
   du globe de Hype : la liste se retrouvait par-dessus le champ, et les
   dix-huit lignes étaient hors écran. Elle vit maintenant dans le flux,
   entre la recherche et les puces, et elle défile. */
/* ⚠️ Le globe occupe 58dvh, et ma première mise en page posait la
   recherche à 50dvh : elle lui recouvrait les 8 derniers pourcents et la
   sphère paraissait coupée en bas. Le globe passe à 64dvh — il respire —
   et tout le reste descend sous lui.
   La recherche est masquée : elle venait de la recherche de clubs de Hype,
   et sur dix-huit destinations les quatre puces suffisent. Taper au clavier
   pour trouver une ville dans une liste de dix-huit, c'est du travail en
   trop. Une ligne à retirer si tu veux la revoir. */
canvas#globe{height:64dvh!important}
.glowcast{top:58dvh!important}
.wrap .search{display:none!important}

/* ⚠️ MISE EN PAGE LINGUAE — refaite au rendu mesuré, pas à l'estime.
   Le globe de Hype plaçait la liste des clubs en absolu sous sa recherche
   (« top: 59dvh + 56px ») : avec dix-huit destinations à montrer, elle
   passait par-dessus le champ et débordait de l'écran.
   Trois blocs, trois zones franches, plus aucun chevauchement :
     le globe en haut, la recherche, la liste qui défile, les puces en bas. */
/* Les puces mesurent 121 px de haut au rendu (rangée défilante + marges)
   et commencent à 726 sur un écran de 844 : la liste doit s'arrêter avant. */
#results{position:fixed;left:14px;right:14px;top:calc(64dvh + 10px);bottom:68px;
  z-index:9;border-radius:16px;display:none;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(10,16,24,.92),rgba(6,10,16,.96));
  border:1px solid rgba(95,233,240,.14)}
#results.on{display:block}
/* La recherche d'origine est centrée par `left:50%` + `translateX(-50%)`.
   Poser left/right par-dessus sans neutraliser la translation la décalait
   d'une demi-largeur hors écran — visible en capture, invisible au code. */
.wrap .search{position:fixed;left:14px;right:14px;width:auto;
  transform:none;top:calc(50dvh - 6px);z-index:10}
/* Le titre d'origine tenait « YOUR WORLD », dix lettres. « LE TOUR DU
   MONDE » en fait seize et débordait avec son interlettre de 4 px. */
.yw{font-size:13.5px;letter-spacing:2.2px}
/* L'apparition lettre par lettre était réglée pour dix lettres : à seize,
   le décalage cumulé (.5s + i × .22s) dépasse trois secondes et la lueur
   de la dernière reste allumée en permanence — un halo qui masque « DE ».
   On resserre le décalage plutôt que de supprimer l'effet. */
.yw span{animation-duration:.9s!important;
  animation-delay:calc(.25s + var(--i)*.075s)!important}
/* ⚠️ La règle d'origine pose `top:86dvh` et vient APRÈS la mienne : mon
   `bottom` s'ajoutait au `top` au lieu de le remplacer, et la rangée
   s'étirait sur 125 px en débordant sous l'écran. On annule le `top`. */
.filters{top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 12px)!important;
  align-items:center}
.filters .chip{align-self:center}
#results .r{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
#results .r:last-child{border-bottom:0}
#results .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.filters{position:absolute;left:0;right:0;top:86dvh;display:flex;gap:8px;overflow-x:auto;padding:0 18px;z-index:6;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 15px;font-size:12.5px;white-space:nowrap}
.chip.on{color:#20D9F5;border-color:rgba(32,217,245,0.82);background:rgba(32,217,245,0.259)}
.tools{position:absolute;right:14px;top:42dvh;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:6}
.tbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.hint{display:none}
#fiche{display:none;position:absolute;left:50%;transform:translateX(-50%);width:min(300px,calc(100vw - 48px));top:12dvh;max-height:min(44dvh,360px);overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere;border-radius:20px;padding:11px 12px;z-index:8;border:1px solid rgba(232,200,135,.28)}
.faddr{font-size:12px;opacity:.5;margin-top:4px}
.fgal{display:none}
.fgal i{flex:1;height:52px;border-radius:9px;background:linear-gradient(135deg,#223440,#0c141b);border:1px solid rgba(143,212,230,.12)}
.fsec{margin:2px 0 9px}
.fsec .s{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.fsec .s .ic{width:16px;flex-shrink:0;opacity:.8}
.fsec .s .lb{width:82px;flex-shrink:0;opacity:.5}
.fsec .s .vl{flex:1;opacity:.88}
#around{position:absolute;left:0;right:0;top:205dvh;z-index:6;padding-left:18px}
#around .hd{display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px;padding-right:18px}
#around_hd{transition:opacity .3s;text-transform:uppercase;letter-spacing:1.5px}
#around .lst{transition:opacity .3s}
#around .dots{display:flex;gap:6px}
#around .d{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
#around .d.on{background:#20D9F5;box-shadow:0 0 6px #20D9F5}
#around .lst{display:flex;gap:9px;overflow-x:auto;padding:0 18px 2px 0;scrollbar-width:none}
#around .lst::-webkit-scrollbar{display:none}
#around .ac{flex:0 0 auto;width:152px;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:9px}
#around .ac .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
#around .ac .rk{width:19px;height:19px;border-radius:50%;background:rgba(32,217,245,0.296);color:#20D9F5;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fclose{position:absolute;top:11px;right:15px;font-size:22px;line-height:1;opacity:.6}
.fnom{font-size:18px;letter-spacing:1px;padding-right:20px}
.freg{font-size:12.5px;opacity:.6;margin-top:3px}
.fphoto{height:54px;border-radius:13px;margin:7px 0;background:linear-gradient(135deg,#243845,#0c141b);border:1px solid rgba(143,212,230,.15);display:flex;align-items:center;justify-content:center}
.ftype{font-size:11px;letter-spacing:1px;color:#20D9F5;margin-bottom:7px}
.fdisc{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.fdisc b{font-weight:500;font-size:11px;opacity:.85;background:rgba(255,255,255,.06);padding:4px 9px;border-radius:8px}
.finfo{font-size:12px;opacity:.7;line-height:1.55;margin-bottom:8px}
.fbtn{position:sticky;bottom:0;text-align:center;padding:12px;border-radius:13px;background:#0d2b30;border:1px solid rgba(32,217,245,0.82);color:#20D9F5;font-weight:700;font-size:14.5px}
.fsoc{margin-bottom:11px;font-size:12.5px}
.fsoc a{color:#20D9F5;text-decoration:none;margin-right:14px}
.affbtn{margin-bottom:11px;text-align:center;padding:9px;border-radius:11px;background:rgba(232,200,135,.14);border:1px solid rgba(232,200,135,.5);color:#E8C887;font-weight:600;font-size:13px;cursor:pointer}
#affoverlay{display:none;position:absolute;inset:0;z-index:30;background:rgba(4,7,13,.94);align-items:center;justify-content:center;padding:22px}
#affoverlay img{max-width:100%;max-height:92%;border-radius:14px;box-shadow:0 10px 40px rgba(10,26,36,0.132)}
#affclose{position:absolute;top:14px;right:18px;font-size:32px;line-height:1;color:#EAF1F4;opacity:.85}

@keyframes ywOrb{to{transform:rotate(360deg)}}
#orb{display:none;position:absolute;right:20px;left:auto;margin-left:0;top:67dvh;width:40px;height:40px;z-index:11}
#orb .orbring{position:absolute;inset:0;opacity:.85;animation:ywOrb 70s linear infinite}
#orbBtn{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(95,233,240,.45);background:radial-gradient(circle at 32% 28%, rgba(95,233,240,.3), rgba(10,20,26,.92) 55%, #05090d 100%);cursor:pointer;padding:0;box-shadow:0 0 20px rgba(95,233,240,.25), inset 0 0 12px rgba(95,233,240,.14);overflow:hidden}
#orbBtn .orbsweep{position:absolute;inset:2px;border-radius:50%;background:conic-gradient(from 0deg, transparent 0deg, rgba(95,233,240,.4) 55deg, transparent 140deg);animation:ywOrb 9s linear infinite;-webkit-mask-image:radial-gradient(circle, transparent 55%, #000 62%);mask-image:radial-gradient(circle, transparent 55%, #000 62%)}
body.onb .wrap{height:118dvh}body.onb #globe{top:0dvh}body.onb .glowcast{top:40dvh}
body.onb #around{top:80dvh}
body.onb .filters{top:96dvh}

/* Linguae : le calque parent porte déjà son bouton de fermeture (#globeX).
   La flèche de retour du globe se superposait exactement dessus — deux
   boutons empilés au même endroit, dont un qui ne mène nulle part ici. */
.back{display:none!important}
#orb{display:none!important}
</style></head>
<body><div class="wrap">
<canvas id="globe"></canvas><div id="bgr"></div><div class="glowcast"></div>

<div class="top">
  <div class="row1"><span class="back">&#8249;</span><span class="yw"><span style="--i:0">L</span><span style="--i:1">E</span><span style="--i:2">&nbsp;</span><span style="--i:3">T</span><span style="--i:4">O</span><span style="--i:5">U</span><span style="--i:6">R</span><span style="--i:7">&nbsp;</span><span style="--i:8">D</span><span style="--i:9">U</span><span style="--i:10">&nbsp;</span><span style="--i:11">M</span><span style="--i:12">O</span><span style="--i:13">N</span><span style="--i:14">D</span><span style="--i:15">E</span></span></div><span class="ywu"></span>

</div>
<div id="results" class="glass"></div>

<div class="tools">

</div>

<div class="filters" id="filters"></div>

<div id="orb"><svg viewBox="0 0 88 88" class="orbring"><circle cx="44" cy="44" r="40" fill="none" stroke="rgba(95,233,240,.16)" stroke-width="1" stroke-dasharray="2 10"></circle><path d="M44 4 A40 40 0 0 1 79 30" fill="none" stroke="rgba(95,233,240,.32)" stroke-width="1"></path><circle cx="44" cy="4" r="1.4" fill="#5FE9F0" opacity=".8"></circle><circle cx="79" cy="30" r="1.6" fill="#5FE9F0" opacity=".8"></circle><circle cx="74" cy="70" r="1.1" fill="#5FE9F0" opacity=".8"></circle><circle cx="22" cy="78" r="1.4" fill="#5FE9F0" opacity=".8"></circle><circle cx="6" cy="50" r="1.1" fill="#5FE9F0" opacity=".8"></circle><circle cx="17" cy="17" r="1.2" fill="#5FE9F0" opacity=".8"></circle></svg><button id="orbBtn" aria-label="Continuer"><i class="orbsweep"></i></button></div>

<div id="around">
  <div class="hd"><span id="around_hd">Les plus populaires</span><span class="dots"><i class="d on" data-k="0"></i><i class="d" data-k="1"></i></span></div>
  <div class="lst" id="around_lst"></div>
</div>

<div id="fiche" class="glass">
  <div class="fclose" id="fx">&times;</div>
  <div class="cinzel fnom" id="f_nom"></div>
  <div class="freg" id="f_reg"></div>
  <div class="faddr" id="f_addr"></div>
  <div class="fphoto"><svg viewBox="0 0 44 44" width="36" height="36" style="opacity:.5"><path d="M9 22.5C9 20 10.2 17.8 12.8 16.4 15.2 15.1 17 13.2 18.4 11.2L20.3 11.8 21.3 5.6 23.4 11.5 24.6 11.3 26.8 5.9 28.7 11.9C31.4 13.2 33.4 15.8 34.6 19 36.2 23.3 36.9 30.2 35.2 37L25.4 37C25.4 31.4 23.9 28.3 21.2 25.8 18.8 23.7 15 24.8 12 26.2 10.1 24.7 9 23.8 9 22.5Z" fill="#9EE8F2"/></svg></div>
  <div class="fgal"><i></i><i></i><i></i></div>
  <div class="ftype" id="f_type"></div>
  <div class="fdisc" id="f_disc"></div>
  <div class="fsec" id="f_sec"></div>
  <div class="finfo" id="f_info"></div>
  <div id="f_extra"></div>
  <div class="fbtn" id="fbtn">Partir</div>
</div>
<div id="affoverlay"><span id="affclose">&times;</span><img id="affimg" src="" alt="Affiche des stages"></div>
</div>
