<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060709">
<title>Hype Lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#060709; --anthracite:#111417; --turquoise:#20D9F5;
  --blanc:#F4F7FA; --gris:#7E8A96; --or:#D4AF37;
  --verre:rgba(255,255,255,.045); --bord:rgba(32,217,245,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--noir);color:var(--blanc)}
body{font-family:'Montserrat',system-ui,sans-serif;font-weight:400;
  min-height:100svh;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--turquoise);outline-offset:3px}

/* ---------- structure ---------- */
#lingo{max-width:520px;margin:0 auto;position:relative}
.lg-ecran{position:relative;padding:calc(env(safe-area-inset-top) + 18px) 20px
  calc(env(safe-area-inset-bottom) + 40px);min-height:100svh;
  display:flex;flex-direction:column;align-items:center}
.lg-ciel{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(80% 50% at 50% 0%, rgba(32,217,245,.13), transparent 70%),
   radial-gradient(60% 40% at 15% 85%, rgba(32,217,245,.06), transparent 70%)}
.lg-ecran>*{position:relative;z-index:1}

/* ---------- typographie ---------- */
.lg-sur{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--turquoise);margin:14px 0 6px;font-weight:500}
.lg-h1{font-family:'Cinzel',serif;font-weight:500;font-size:26px;line-height:1.25;
  letter-spacing:.02em;text-align:center;margin:0 0 22px}
.lg-h2{font-family:'Cinzel',serif;font-weight:500;font-size:19px;margin:2px 0 6px;
  text-align:center;line-height:1.35}
.lg-eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gris);margin:0 0 4px;text-align:center}
.lg-note{font-size:12.5px;color:var(--gris);text-align:center;margin:8px 0 0;line-height:1.6}
.lg-note-or{color:var(--or)}
.lg-consigne{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris);margin:10px 0 26px;text-align:center}

/* ---------- Apy ---------- */
.lg-apy-grand{width:180px;height:auto;margin-top:6px;
  filter:drop-shadow(0 0 26px rgba(32,217,245,.34));animation:flotte 7s ease-in-out infinite}
.lg-apy-fete{width:120px;height:auto;filter:drop-shadow(0 0 22px rgba(32,217,245,.4))}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ---------- choix du pays ---------- */
.lg-pays{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.lg-pays-b{display:flex;align-items:center;gap:9px;padding:13px 12px;text-align:left;
  background:var(--verre);border:1px solid rgba(255,255,255,.07);border-radius:15px;
  transition:border-color .22s, background .22s, transform .22s}
.lg-pays-b:active{transform:scale(.97)}
.lg-pays-b.est-actif{border-color:var(--turquoise);background:rgba(32,217,245,.09);
  box-shadow:0 0 0 1px rgba(32,217,245,.25), 0 10px 30px -14px rgba(32,217,245,.6)}
.lg-drapeau{font-size:21px;line-height:1}
.lg-pays-nom{font-size:13px;font-weight:500;flex:1}
.lg-pays-lg{font-size:9.5px;letter-spacing:.16em;color:var(--gris)}

.lg-chapitre{width:100%;margin-top:26px;padding:22px 18px 20px;text-align:center;
  background:linear-gradient(180deg, rgba(32,217,245,.07), rgba(255,255,255,.02));
  border:1px solid var(--bord);border-radius:20px}

/* ---------- boutons ---------- */
.lg-cta{display:block;width:100%;margin-top:20px;padding:15px 20px;
  font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--noir);background:var(--turquoise);border-radius:13px;
  box-shadow:0 14px 34px -16px rgba(32,217,245,.85);transition:transform .18s}
.lg-cta:active{transform:scale(.98)}
.lg-lien{margin-top:20px;font-size:12px;letter-spacing:.1em;color:var(--gris);
  text-decoration:underline;text-underline-offset:4px}

/* ---------- barre de progression ---------- */
.lg-barre{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:6px}
.lg-fermer{font-size:17px;color:var(--gris);padding:4px 8px 4px 0;line-height:1}
.lg-barre-t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin:0}
.lg-jauge{display:flex;gap:4px;flex:1}
.lg-seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .3s}
.lg-seg.est-fait{background:var(--turquoise)}
.lg-seg.est-ici{background:rgba(32,217,245,.45)}

.lg-corps{width:100%;display:flex;flex-direction:column;align-items:center;flex:1;
  animation:entre .34s ease both}
@keyframes entre{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- LA CARTE DE MOT : le mot est le heros ---------- */
.lg-carte{position:relative;width:100%;padding:34px 22px 26px;text-align:center;
  background:linear-gradient(170deg, rgba(32,217,245,.10), rgba(17,20,23,.9) 55%);
  border:1px solid var(--bord);border-radius:24px;overflow:hidden;
  box-shadow:0 30px 70px -40px rgba(32,217,245,.55)}
.lg-halo{position:absolute;top:-40%;left:50%;width:230px;height:230px;margin-left:-115px;
  background:radial-gradient(circle, rgba(32,217,245,.3), transparent 65%);
  filter:blur(12px);pointer-events:none}
.lg-carte-mot{position:relative;font-family:'Cinzel',serif;font-size:33px;font-weight:600;
  margin:0;line-height:1.15;letter-spacing:.01em}
.lg-carte-phon{font-size:12.5px;color:var(--turquoise);letter-spacing:.16em;margin:9px 0 0}
.lg-carte-var{font-size:11px;color:var(--gris);margin:7px 0 0;font-style:italic}
.lg-fil{width:34px;height:1px;background:var(--bord);margin:17px auto}
.lg-carte-trad{font-size:15px;font-weight:500;color:var(--blanc);margin:0;opacity:.92}
.lg-son{margin-top:18px;padding:9px 17px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--turquoise);
  border:1px solid var(--bord);border-radius:99px;background:rgba(32,217,245,.05)}
.lg-def{font-size:13px;line-height:1.7;color:var(--gris);text-align:center;
  margin:22px 4px 0;max-width:400px}

/* ---------- exercices ---------- */
.lg-invite{font-family:'Cinzel',serif;font-size:27px;text-align:center;margin:0 0 26px;line-height:1.25}
.lg-invite-petit{font-size:16px;font-family:'Montserrat',sans-serif;color:var(--gris);font-weight:300}
.lg-options{display:flex;flex-direction:column;gap:9px;width:100%}
.lg-opt{padding:15px 18px;font-size:14.5px;text-align:left;
  background:var(--verre);border:1px solid rgba(255,255,255,.08);border-radius:14px;
  transition:border-color .2s, background .2s, transform .16s}
.lg-opt:active{transform:scale(.985)}
.lg-opt.est-juste{border-color:var(--turquoise);background:rgba(32,217,245,.12)}
.lg-opt.est-faux{border-color:rgba(255,120,120,.5);background:rgba(255,120,120,.08)}
.lg-opt:disabled{opacity:.55}
.lg-opt.est-juste:disabled,.lg-opt.est-faux:disabled{opacity:1}

.lg-hautparleur{width:86px;height:86px;border-radius:50%;font-size:26px;color:var(--turquoise);
  background:rgba(32,217,245,.08);border:1px solid var(--bord);
  box-shadow:0 0 44px -14px rgba(32,217,245,.8);transition:transform .18s}
.lg-hautparleur:active{transform:scale(.94)}
.lg-rejouer{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris);margin:12px 0 26px}

.lg-champ{width:100%;padding:16px 18px;font-size:17px;color:var(--blanc);text-align:center;
  background:var(--verre);border:1px solid rgba(255,255,255,.1);border-radius:14px}
.lg-champ.est-juste{border-color:var(--turquoise)}
.lg-champ.est-faux{border-color:rgba(255,120,120,.5)}

.lg-ligne{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%;
  min-height:56px;padding:12px;border-radius:14px;
  border:1px dashed rgba(32,217,245,.22);background:rgba(32,217,245,.03)}
.lg-ligne-vide{color:var(--gris);letter-spacing:.4em;font-size:13px;align-self:center}
.lg-banc{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.lg-tuile{padding:10px 14px;font-size:14px;background:var(--verre);
  border:1px solid rgba(255,255,255,.1);border-radius:11px;transition:transform .15s}
.lg-tuile:active{transform:scale(.95)}
.lg-tuile.est-posee{border-color:var(--bord);background:rgba(32,217,245,.09)}

.lg-verdict{width:100%}
.lg-verdict.est-juste,.lg-verdict.est-faux{margin-top:22px;padding:16px 18px 18px;
  border-radius:16px;animation:entre .26s ease both}
.lg-verdict.est-juste{background:rgba(32,217,245,.07);border:1px solid var(--bord)}
.lg-verdict.est-faux{background:rgba(255,120,120,.06);border:1px solid rgba(255,120,120,.28)}
.lg-verdict-t{font-family:'Cinzel',serif;font-size:16px;margin:0}
.lg-verdict-r{font-size:13px;color:var(--gris);margin:6px 0 0}

/* ---------- LE PASSEPORT ET SON TAMPON (element signature) ---------- */
.lg-passeport{width:100%;margin-top:24px}
.lg-pp-titre{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gris);margin:0 0 8px;text-align:center}
.lg-pp-page{position:relative;padding:20px 18px 26px;min-height:158px;border-radius:14px;
  background:linear-gradient(150deg, #10161c, #0a0e12);
  border:1px solid rgba(212,175,55,.22);overflow:hidden}
.lg-pp-page::before{content:"";position:absolute;inset:6px;border:1px solid rgba(212,175,55,.1);
  border-radius:9px;pointer-events:none}
.lg-pp-pays{font-family:'Cinzel',serif;font-size:14px;margin:0 0 14px;color:var(--or)}
.lg-pp-lignes{display:flex;flex-direction:column;gap:9px;max-width:62%}
.lg-pp-l{height:1px;background:rgba(255,255,255,.09)}
.lg-pp-l:nth-child(2){width:78%}.lg-pp-l:nth-child(3){width:54%}.lg-pp-l:nth-child(4){width:66%}
.lg-tampon{position:absolute;right:16px;bottom:16px;width:118px;height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border:2.5px solid rgba(32,217,245,.75);border-radius:50%;
  color:var(--turquoise);transform:rotate(-13deg);
  box-shadow:0 0 30px -8px rgba(32,217,245,.55);
  animation:tamponne .62s cubic-bezier(.2,1.5,.4,1) .35s both}
.lg-tampon::after{content:"";position:absolute;inset:7px;border:1px solid rgba(32,217,245,.4);
  border-radius:50%}
.lg-tampon-h{font-family:'Cinzel',serif;font-size:13px;text-align:center;padding:0 12px;line-height:1.2}
.lg-tampon-b{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
@keyframes tamponne{
  0%{opacity:0;transform:rotate(-13deg) scale(2.9);filter:blur(4px)}
  70%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:rotate(-13deg) scale(1)}}
.lg-score{font-family:'Cinzel',serif;font-size:21px;color:var(--turquoise);margin:0}

/* ---------- collection ---------- */
.lg-col .lg-eyebrow{margin:16px 0 14px}
.lg-grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.lg-mini{position:relative;height:132px;border-radius:16px;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
.lg-mini.est-retourne{transform:rotateY(180deg)}
.lg-mini-face,.lg-mini-dos{position:absolute;inset:0;padding:14px 12px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lg-mini-face{background:linear-gradient(165deg, rgba(32,217,245,.11), rgba(17,20,23,.95));
  border:1px solid var(--bord)}
.lg-mini-dos{background:var(--anthracite);border:1px solid rgba(255,255,255,.09);
  transform:rotateY(180deg)}
.lg-mini.est-verrouille .lg-mini-face{background:rgba(255,255,255,.025);
  border:1px dashed rgba(255,255,255,.1)}
.lg-mini.est-verrouille .lg-mini-mot{color:var(--gris);opacity:.5}
.lg-mini-mot{font-family:'Cinzel',serif;font-size:17px;margin:0;text-align:center;line-height:1.2}
.lg-mini-trad{font-size:11px;color:var(--gris);margin:0;text-align:center}
.lg-mini-def{font-size:11px;line-height:1.55;color:var(--gris);margin:0;text-align:center}
.lg-points{display:flex;gap:4px;margin-top:4px}
.lg-pt{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.15)}
.lg-pt.est-plein{background:var(--turquoise)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div id="lingo"></div>

<script>
/* ==================================================================
   LE PONT — HYPE_LINGO_HOST
   ------------------------------------------------------------------
   Lingo ne connait QUE cet objet. Ici, sa version autonome : la
   progression vit dans le telephone, il n'y a ni compte, ni Supabase,
   ni Stripe. Le jour ou Hype accueille le module, l'index remplace ces
   six fonctions par les siennes et RIEN d'autre ne change dans Lingo.
   ================================================================== */
window.HYPE_LINGO_HOST = window.HYPE_LINGO_HOST || {

  /* langue de l'interface : fr ou en pour l'instant */
  langue: function () {
    var l = (navigator.language || "fr").slice(0, 2).toLowerCase();
    return (l === "en") ? "en" : "fr";
  },

  charger: function () {
    try { return JSON.parse(localStorage.getItem("hype_lingo_v1")); }
    catch (e) { return null; }
  },

  sauver: function (etat) {
    try { localStorage.setItem("hype_lingo_v1", JSON.stringify(etat)); }
    catch (e) { /* mode navigation privee : la partie reste jouable */ }
  },

  /* en autonome l'XP ne part nulle part ; dans Hype il ira aux Quetes */
  xpAjouter: function () {},

  /* pas de Stripe hors de Hype : tout est ouvert */
  estPremium: function () { return true; },

  /* pas de bouton retour hors de Hype */
  quitter: null
};
</script>

<script src="hype-lingo-lex-ecurie.js"></script>
<script src="hype-lingo.js"></script>
<script>
  window.HypeLingo.demarrer(document.getElementById("lingo"));
</script>
</body>
</html>
