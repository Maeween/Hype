<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maquette · Médias de la saison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Maquette du 12/11 (Blandine) : une page Médias commune à tous les concours de la saison,
   à l'adresse de l'actuelle page Médias de l'équipe. Vraies données (vidéos et photos en ligne), vraies polices. */
:root{--noir:#070A08;--pan:#0B0E0C;--iv:#F3EEE4;--iv2:rgba(243,238,228,.72);--iv3:rgba(243,238,228,.48);--ch:#C9A66B;--ch2:rgba(201,166,107,.55);--ch3:rgba(201,166,107,.22);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--noir);color:var(--iv);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{max-width:100%}
button{font:inherit}
.page{max-width:820px;margin:0 auto}
.hero{position:relative;height:330px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 35%;-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 96%);mask-image:linear-gradient(180deg,#000 40%,transparent 96%)}
.hero .txt{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:46px;text-align:right}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(54px,15vw,84px);line-height:.95}
.hero p{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(20px,5.6vw,28px);color:var(--iv)}
.hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px}
.wrap{padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.retour{display:inline-block;margin-top:14px;color:var(--ch);font-size:13px;font-weight:600;text-decoration:none}
.intro{font-size:13px;line-height:1.6;color:var(--iv2);margin:14px 0 0;max-width:46ch}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:22px 0 4px;border-top:1px solid rgba(243,238,228,.1);border-bottom:1px solid rgba(243,238,228,.1)}
.chiffres div{padding:14px 4px;text-align:center}
.chiffres div+div{border-left:1px solid rgba(243,238,228,.08)}
.chiffres b{display:block;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1;color:var(--iv)}
.chiffres span{display:block;margin-top:5px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--iv3)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:26px -4px 4px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--noir) 80%,rgba(7,10,8,0));padding-top:env(safe-area-inset-top)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;border-bottom:1.5px solid transparent;color:var(--iv3);font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:12px 10px;cursor:pointer}
.tab.on{color:var(--iv);border-bottom-color:var(--ch)}
.tab:focus-visible,.btn:focus-visible{outline:1px solid var(--ch);outline-offset:3px}
/* chapitre de concours */
.cc{padding:34px 0 8px}
.cc-tete{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.cc-date{width:64px;text-align:center;border-right:1px solid var(--ch3);padding-right:14px}
.cc-date b{display:block;font-family:var(--serif);font-weight:500;font-size:40px;line-height:.9}
.cc-date span{display:block;margin-top:4px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ch)}
.cc-t{font-family:var(--serif);font-weight:500;font-size:clamp(24px,7vw,32px);line-height:1.05;text-wrap:balance}
.cc-l{font-size:11.5px;color:var(--iv3);margin-top:5px}
.cc-n{font-size:11px;color:var(--iv2);margin-top:6px}
.galh{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:18px calc(-1*max(18px,env(safe-area-inset-right))) 0 0;padding-right:18px;scroll-snap-type:x proximity}
.galh::-webkit-scrollbar{display:none}
.m{position:relative;flex:0 0 auto;height:clamp(150px,44vw,250px);border-radius:12px;overflow:hidden;background:var(--pan);scroll-snap-align:start;line-height:0}
.m img{height:100%;width:auto;display:block}
.m .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(243,238,228,.7);background:rgba(7,10,8,.45);display:flex;align-items:center;justify-content:center}
.m .d{position:absolute;right:7px;bottom:7px;font-size:10.5px;line-height:1;padding:5px 8px;border-radius:7px;background:rgba(7,10,8,.72);color:var(--iv)}
.m .qui{position:absolute;left:7px;bottom:7px;max-width:80%;font-size:10.5px;line-height:1.2;padding:5px 8px;border-radius:7px;background:rgba(7,10,8,.72);color:var(--iv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--ch2);background:transparent;color:var(--iv);font-size:12.5px;cursor:pointer;text-decoration:none}
.btn i{font-style:normal;color:var(--ch)}
.courbe{display:block;width:100%;height:30px;margin:26px 0 0}
/* cavalier / cheval : frise de la saison */
.pp{padding:34px 0 6px}
.pp-tete{display:flex;align-items:center;gap:14px}
.av{flex:0 0 64px;width:64px;height:64px;border-radius:50%;border:1px solid var(--ch2);overflow:hidden;background:var(--pan);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:28px;color:var(--ch)}
.av img{width:100%;height:100%;object-fit:cover}
.pp-n{font-family:var(--serif);font-weight:500;font-size:clamp(28px,8vw,36px);line-height:1}
.pp-s{font-size:11.5px;color:var(--iv3);margin-top:5px}
.prog{margin-top:14px;font-size:12px;color:var(--iv2);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prog .pl{border:1px solid var(--ch2);border-radius:999px;padding:3px 10px;color:var(--iv);font-size:11.5px}
.prog .pl.or{border-color:var(--ch);color:var(--ch)}
.prog .fl{color:var(--ch)}
.frise{position:relative;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:18px calc(-1*max(18px,env(safe-area-inset-right))) 0 0;padding:0 18px 4px 0}
.frise::-webkit-scrollbar{display:none}
.etape{flex:0 0 auto;position:relative;padding-top:38px}
.etape:before{content:"";position:absolute;top:26px;left:0;right:-18px;height:1px;background:linear-gradient(90deg,var(--ch),rgba(201,166,107,.25))}
.etape:last-child:before{right:0;background:linear-gradient(90deg,var(--ch),rgba(201,166,107,0))}
.etape .pt{position:absolute;top:22px;left:0;width:9px;height:9px;border-radius:50%;background:var(--noir);border:1px solid var(--ch)}
.etape .qd{position:absolute;top:0;left:0;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ch);white-space:nowrap}
.etape .lg{margin-top:9px;max-width:220px}
.etape .lg b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etape .lg span{display:block;font-size:10.5px;color:var(--iv3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etape .lg .res{display:inline-block;margin-top:6px;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--ch2);color:var(--iv)}
.etape .lg .res.pod{border-color:var(--ch);color:var(--ch)}
.vue[hidden]{display:none!important}
.ajout{display:flex;justify-content:center;margin:40px 0 0}
.ajout .btn{font-size:14px;padding:0 26px;min-height:46px}
.partage{display:flex;align-items:center;gap:12px;margin:44px 0 0;padding:10px 2px;border-top:1px solid rgba(201,166,107,.18);border-bottom:1px solid rgba(201,166,107,.18)}
.partage div{flex:1;font-family:var(--serif);font-size:18px;color:rgba(243,238,228,.82)}
.partage span{width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,166,107,.45);display:inline-flex;align-items:center;justify-content:center;color:var(--ch)}
.fin{padding:56px 0 30px}
.fin .im{position:relative;height:118px;overflow:hidden}
.fin .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fin .im:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--noir) 0%,rgba(7,10,8,0) 12%,rgba(7,10,8,0) 88%,var(--noir) 100%)}
.fin .hy{display:flex;align-items:center;gap:14px;padding:6px 24px 0}
.fin .hy i{flex:1;height:1px;background:linear-gradient(90deg,rgba(197,170,120,0),rgba(197,170,120,.55))}
.fin .hy i+b+i{background:linear-gradient(270deg,rgba(197,170,120,0),rgba(197,170,120,.55))}
.fin .hy b{font-family:var(--serif);font-weight:400;font-size:13px;letter-spacing:4px;color:#C5AA78}
.bandeau-maq{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--iv3);text-align:center;padding:10px 0 0}
@media (min-width:768px){.hero{height:420px}.m{height:240px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <img src="images/concours-hero-bai-tresse.webp" alt="">
    <div class="txt"><h1>Médias</h1><p>Team CSO Club · SEP</p></div>
    <svg viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C 140 44, 260 30, 400 6" fill="none" stroke="#C9A66B" stroke-width="1.1"/></svg>
  </div>
  <div class="wrap">
    <div class="bandeau-maq">Maquette · vraies vidéos et photos en ligne</div>
    <a class="retour" href="#">‹ L'équipe</a>
    <p class="intro">Tous les concours de la saison au même endroit : revois chaque concours, ou suis un cavalier ou un cheval d'un concours à l'autre.</p>
    <div class="chiffres" id="chiffres"></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-v="concours" role="tab" aria-selected="true">Par concours</button>
      <button class="tab" data-v="cavalier" role="tab" aria-selected="false">Par cavalier</button>
      <button class="tab" data-v="cheval" role="tab" aria-selected="false">Par cheval</button>
    </div>
    <div class="vue" id="v-concours"></div>
    <div class="vue" id="v-cavalier" hidden></div>
    <div class="vue" id="v-cheval" hidden></div>
    <div class="ajout"><button class="btn" type="button"><i>+</i> Ajouter des médias</button></div>
    <div class="partage"><div>Partage cette page</div>
      <span><svg viewBox="0 0 24 24" width="17" height="17"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></g></svg></span>
      <span><svg viewBox="0 0 24 24" width="17" height="17"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></g></svg></span>
      <span><svg viewBox="0 0 24 24" width="17" height="17"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z"/></g></svg></span>
    </div>
  </div>
  <div class="fin" aria-hidden="true"><div class="im"><img src="images/accueil_v2_fin_de_page_v1.webp" alt=""></div><div class="hy"><i></i><b>HYPE</b><i></i></div></div>
</div>
<script>
(function(){
var B="https://ldpjebgtskzdokrublfg.supabase.co/storage/v1/object/public/photos/", S="bc7c52ee-7a42-4162-97dd-50ff5885941e/";
var AV={"Aurélie":"6ca52fb4-6808-4b7c-8563-f49c6f8d6cb8/1791529262561.jpg","Chloé":"273a4599-1356-426f-8889-af563ad6b9b6/1785081119406.jpg","Ella":"f1d46b66-34d3-464b-babd-fc601806cb47/1790781034093.jpg","Eva":"05f6c9a5-b585-4db9-86f6-0da4d54774cf/1793535777646.jpg","MAELYS":"72a143cd-a079-4d24-bf6b-4796c4901bcb/1794390673468.jpg","Romy-Thaïs":"a59219b4-ab66-4258-9d83-ab1ed1910eda/1793388174339.jpg"};
/* concours de la saison qui ont des médias (club_agenda + team_videos + commentaires, lus le 12/11) */
var CONC=[
 {id:"tig",t:"CSO Tigery",l:"Tigery",d:"2026-11-08",ph:[S+"1794229413058.jpeg",S+"1794238407581.jpeg"]},
 {id:"fol",t:"CSO équipe club / challenge",l:"Haras de Folleville",d:"2026-10-25",ph:[S+"1792862331818.png",S+"1792862466139.png",S+"1793362472850.jpeg",S+"1793362647675.jpeg"]},
 {id:"etp",t:"CSO étrier de Paris",l:"Étrier de Paris",d:"2026-09-20",ph:[S+"1789937988281.jpeg",S+"1789911510811.jpg",S+"1789985936680.jpeg"]},
 {id:"etr",t:"CSO l’étrier",l:"L’étrier de Paris",d:"2026-09-20",ph:[S+"1789938601761.jpeg",S+"1789938429889.jpg",S+"1790846296418.jpeg"]},
 {id:"cso",t:"Cso",l:"Haras de Folleville",d:"2026-09-13",ph:[S+"1789406356051.jpg"]},
 {id:"ch1",t:"CSO challenge 1",l:"Haras de Folleville",d:"2026-09-12",ph:[S+"1789723330205.jpg",S+"1789721927174.jpg",S+"1789722142205.jpg",S+"1789723373789.png"]}
];
var VID=[
 {c:"tig",cav:"Chloé",ch:"Daphne velleda",ep:"Club 3",du:74,v:S+"1794158600293.jpg"},
 {c:"tig",cav:"Chloé",ch:"Daphne velleda",ep:"Club 2",du:83,v:S+"1794145372422.jpg"},
 {c:"tig",cav:"Evan",ch:"Rizotto d'Emery",ep:"Club 2",du:70,v:S+"1794144452411.jpg"},
 {c:"fol",cav:"Eva",ch:"Orchid’s yellow",ep:"Club 3 Vitesse",res:"1er / 21",du:56,v:"05f6c9a5-b585-4db9-86f6-0da4d54774cf/1794419162293.jpg"},
 {c:"fol",cav:"Ella",ch:"Aceitunero",ep:"Club 3 Vitesse",res:"2e / 21",du:43,v:"f1d46b66-34d3-464b-babd-fc601806cb47/1794492944552.jpg"},
 {c:"fol",cav:"Eva",ch:"Apache du Lys",ep:"Club 3 Vitesse",res:"5e / 21",du:58,v:"05f6c9a5-b585-4db9-86f6-0da4d54774cf/1794404369180.jpg"},
 {c:"fol",cav:"Ella",ch:"Ecolo louvo",ep:"Club 3 Vitesse",res:"El.",du:48,v:"f1d46b66-34d3-464b-babd-fc601806cb47/1794492892302.jpg"},
 {c:"fol",cav:"MAELYS",ch:"Dakota ca",du:82,v:S+"1794005139082.jpg"},
 {c:"fol",cav:"MAELYS",ch:"Aceitunero",du:59,v:S+"1794006363513.jpg"},
 {c:"fol",cav:"Aurélie",ch:"Elle m’a dit circee",du:33,v:S+"1794005746177.jpg"},
 {c:"fol",cav:"Emma",ch:"Ecolo louvo",du:63,v:S+"1794005998948.jpg"},
 {c:"fol",cav:"Romy-Thaïs",ch:"Cirrus des lauriers",du:37,v:S+"1794006233535.jpg"},
 {c:null,dt:"2026-11-11",cav:"Aurélie",ch:"Orchid’s yellow",du:13,v:"6ca52fb4-6808-4b7c-8563-f49c6f8d6cb8/1794390570461.jpg"}
];
var MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function cO(id){for(var i=0;i<CONC.length;i++)if(CONC[i].id===id)return CONC[i];return null}
function dt(v){var c=cO(v.c);return c?c.d:v.dt}
function jm(d){var x=d.split("-");return {j:+x[2],m:MOIS[+x[1]-1]}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function duree(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
var PLAY='<span class="play"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 6.5v11l9-5.5z" fill="#F3EEE4"/></svg></span>';
function mv(v,qui){return '<div class="m"><img loading="lazy" src="'+B+v.v+'" alt="">'+PLAY+'<span class="d">'+duree(v.du)+'</span>'+(qui?'<span class="qui">'+esc(qui)+'</span>':'')+'</div>'}
function mp(u){return '<div class="m"><img loading="lazy" src="'+B+u+'" alt=""></div>'}
var COURBE='<svg class="courbe" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C 120 28, 260 4, 400 12" fill="none" stroke="#C9A66B" stroke-opacity=".7" stroke-width="1"/></svg>';
var nP=0;CONC.forEach(function(c){nP+=c.ph.length});
document.getElementById("chiffres").innerHTML='<div><b>'+CONC.length+'</b><span>concours</span></div><div><b>'+VID.length+'</b><span>vidéos</span></div><div><b>'+nP+'</b><span>photos</span></div>';
/* PAR CONCOURS */
var h="";
CONC.forEach(function(c,i){
  var vs=VID.filter(function(v){return v.c===c.id}), d=jm(c.d);
  var n=[];if(vs.length)n.push(vs.length+(vs.length>1?" vidéos":" vidéo"));if(c.ph.length)n.push(c.ph.length+(c.ph.length>1?" photos":" photo"));
  h+=(i?COURBE:"")+'<section class="cc"><div class="cc-tete"><div class="cc-date"><b>'+d.j+'</b><span>'+d.m+'</span></div><div style="min-width:0"><div class="cc-t">'+esc(c.t)+'</div><div class="cc-l">'+esc(c.l)+'</div><div class="cc-n">'+n.join(" · ")+'</div></div></div>'
   +'<div class="galh">'+vs.map(function(v){return mv(v,v.cav+" × "+v.ch+(v.res?" · "+v.res:""))}).join("")+c.ph.map(mp).join("")+'</div>'
   +'<a class="btn" href="#">Voir les médias du concours <i>›</i></a></section>';
});
document.getElementById("v-concours").innerHTML=h;
/* PAR CAVALIER / PAR CHEVAL : la saison en frise, du plus ancien au plus récent */
function grouper(cle,autre){
  var G={},ordre=[];
  VID.forEach(function(v){var k=v[cle];if(!G[k]){G[k]=[];ordre.push(k)}G[k].push(v)});
  ordre.sort(function(a,b){return G[b].length-G[a].length||a.localeCompare(b)});
  return ordre.map(function(k,i){
    var L=G[k].slice().sort(function(a,b){return dt(a).localeCompare(dt(b))});
    var nc={};L.forEach(function(v){nc[v.c||"ent"]=1});var ncc=Object.keys(nc).filter(function(x){return x!=="ent"}).length;
    var res=L.filter(function(v){return v.res});
    var prog=res.length?'<div class="prog"><span>Classements</span>'+res.map(function(v,j){return (j?'<span class="fl">→</span>':'')+'<span class="pl'+(/^[1-3](er|e) /.test(v.res)?" or":"")+'">'+esc(v.res.split(" /")[0])+'</span>'}).join("")+'</div>':"";
    var tete=cle==="cav"?'<div class="av">'+(AV[k]?'<img src="'+B+AV[k]+'" alt="">':esc(k.charAt(0)))+'</div>':'<div class="av">'+esc(k.charAt(0))+'</div>';
    var etapes=L.map(function(v){var d=jm(dt(v)),c=cO(v.c);
      return '<div class="etape"><span class="pt"></span><span class="qd">'+d.j+" "+d.m+'</span>'+mv(v)
       +'<div class="lg"><b>'+esc(v[autre])+'</b><span>'+esc(c?c.t:"Entraînement")+(v.ep?" · "+esc(v.ep):"")+'</span>'+(v.res?'<span class="res'+(/^[1-3](er|e) /.test(v.res)?" pod":"")+'">'+esc(v.res)+'</span>':'')+'</div></div>'}).join("");
    return (i?COURBE:"")+'<section class="pp"><div class="pp-tete">'+tete+'<div style="min-width:0"><div class="pp-n">'+esc(k)+'</div><div class="pp-s">'+L.length+(L.length>1?" vidéos":" vidéo")+(ncc?" · "+ncc+" concours":"")+'</div></div></div>'+prog+'<div class="frise">'+etapes+'</div><a class="btn" href="#">'+(cle==="cav"?"Sa saison complète":"Sa saison complète")+' <i>›</i></a></section>';
  }).join("");
}
document.getElementById("v-cavalier").innerHTML=grouper("cav","ch");
document.getElementById("v-cheval").innerHTML=grouper("ch","cav");
var tabs=document.querySelectorAll(".tab");
function montrer(v){tabs.forEach(function(t){var on=t.getAttribute("data-v")===v;t.classList.toggle("on",on);t.setAttribute("aria-selected",on)});["concours","cavalier","cheval"].forEach(function(x){document.getElementById("v-"+x).hidden=x!==v})}
tabs.forEach(function(t){t.addEventListener("click",function(){montrer(t.getAttribute("data-v"));try{history.replaceState(null,"","#"+t.getAttribute("data-v"))}catch(e){}})});
var hs=(location.hash||"").slice(1);if(hs==="cavalier"||hs==="cheval")montrer(hs);
document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener("click",function(e){e.preventDefault()})});
})();
</script>
</body>
</html>
