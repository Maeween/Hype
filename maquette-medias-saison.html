<title>Maquette · Médias de la saison</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Maquette v2 (12/11, Blandine « Ok ») : copie de la page Médias du concours — même héros (photo, titre dans le noir sous le cheval,
   courbe), même rangée de cartes photo, mêmes blocs. Vraies vidéos et photos en ligne. Page cachée, non reliée à l'appli. */
:root{--noir:#070A08;--pan:#0B0E0C;--iv:#F3EEE4;--iv2:rgba(243,238,228,.75);--iv3:rgba(243,238,228,.5);--ch:#C9A66B;--ch2:rgba(201,166,107,.55);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--noir);color:var(--iv);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{max-width:100%}
button{font:inherit;color:inherit}
.page{max-width:820px;margin:0 auto}
/* héros : comme la fiche concours */
.hero{position:relative;background:var(--noir)}
.hero .ph{min-height:calc(env(safe-area-inset-top) + 210px)}
.hero .ph img{display:block;width:100%;height:auto;max-height:118vw;object-fit:cover;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.hero .titre{position:relative;z-index:3;margin-top:-6px;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(30px,8.6vw,46px);line-height:1.02}
.hero p{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(14px,4vw,19px);opacity:.92;white-space:nowrap}
.hero svg{display:block;width:100%;height:40px;margin-top:10px}
.hero .rond{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 12px);left:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(243,238,228,.55);background:rgba(7,10,8,.32);display:flex;align-items:center;justify-content:center;color:var(--iv);font-size:20px;text-decoration:none}
.wrap{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
/* cartes : comme Engagements / Jour J / Résultats / Médias */
.cartes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:40px;padding-bottom:30px}
.carte{position:relative;aspect-ratio:.82;border-radius:13px;overflow:hidden;border:1px solid rgba(201,166,107,.32);background:linear-gradient(160deg,#141a1c,#0a0d0e);padding:0;cursor:pointer}
.carte.on{border:1.5px solid var(--ch)}
.carte img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carte span{position:absolute;left:0;right:0;bottom:0;padding:26px 4px 11px;background:linear-gradient(180deg,rgba(7,10,8,0),rgba(7,10,8,.85));font-size:12px;font-weight:600;text-align:center}
/* choix du concours / du cavalier / du cheval */
.choix{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(18px,env(safe-area-inset-right))) 0 0;padding:2px 18px 4px 0}
.choix::-webkit-scrollbar,.galh::-webkit-scrollbar,.rangee::-webkit-scrollbar{display:none}
.pil{flex:0 0 auto;border:1px solid var(--ch2);border-radius:999px;padding:8px 13px;background:transparent;font-size:12px;cursor:pointer;white-space:nowrap}
.pil b{font-weight:600;color:var(--ch);margin-right:6px}
.pil.on{border-color:var(--ch);color:var(--ch)}
.per{flex:0 0 auto;width:74px;background:none;border:none;padding:0;cursor:pointer;text-align:center}
.per i{display:block;width:64px;height:64px;margin:0 auto;border-radius:50%;overflow:hidden;border:1px solid var(--ch2);background:var(--pan);font-style:normal;font-family:var(--serif);font-size:26px;line-height:62px;color:var(--ch)}
.per i img{width:100%;height:100%;object-fit:cover;display:block}
.per span{display:block;margin-top:7px;font-size:11px;color:var(--iv2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per.on i{border:1.5px solid var(--ch)}
.per.on span{color:var(--ch)}
/* blocs de la page Médias du concours */
.st{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 18px}
.st h2{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(26px,7.6vw,34px);line-height:1.05;text-wrap:balance}
.st span{flex:0 0 auto;font-size:12.5px;color:var(--iv2)}
.sous{margin:-10px 0 18px;font-size:12px;color:var(--iv3)}
.une{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.une.seule{grid-template-columns:1fr}
.une-p{display:flex;justify-content:center}
.m{position:relative;display:block;padding:0;border:none;background:var(--pan);border-radius:14px;overflow:hidden;line-height:0;cursor:pointer}
.une-p .m img{display:block;max-width:100%;max-height:min(46vh,340px);width:auto;height:auto}
.ronds{display:flex;flex-direction:column;align-items:center;gap:12px}
.rd{position:relative;width:clamp(58px,17vw,96px);height:clamp(58px,17vw,96px);border-radius:50%;overflow:hidden;padding:0;border:1px solid rgba(201,166,107,.6);background:var(--pan);cursor:pointer}
.rd img{width:100%;height:100%;object-fit:cover;display:block}
.rangee,.galh{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:12px;margin-right:calc(-1*max(18px,env(safe-area-inset-right)));padding-right:18px}
.rangee .m{flex:0 0 auto;height:clamp(64px,19vw,110px);border-radius:10px}
.rangee .m img,.galh .m img{height:100%;width:auto;display:block}
.galh .it{flex:0 0 auto;max-width:78vw}
.galh .m{height:clamp(150px,44vw,250px);border-radius:12px}
.play{position:absolute;inset:0;margin:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(243,238,228,.7);background:rgba(7,10,8,.45);display:flex;align-items:center;justify-content:center}
.dur{position:absolute;right:7px;bottom:7px;font-size:10.5px;line-height:1;padding:5px 7px;border-radius:7px;background:rgba(7,10,8,.72);color:var(--iv)}
.leg{margin-top:9px;line-height:1.35}
.leg b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg span{display:block;font-size:10.5px;color:var(--iv3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg em{display:inline-block;margin-top:5px;font-style:normal;font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--ch2)}
.leg em.pod{border-color:var(--ch);color:var(--ch)}
.etape{margin-top:26px}
.etape .qd{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ch)}
.etape .qd:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,166,107,.6),rgba(201,166,107,0))}
.etape .qd small{font-size:10px;letter-spacing:.06em;text-transform:none;color:var(--iv3)}
.actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.lien{color:var(--iv);font-size:12.5px;text-decoration:none;border-bottom:1px solid var(--ch2);padding-bottom:2px}
.lien i{font-style:normal;color:var(--ch)}
.aj{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 16px;border-radius:10px;border:1px solid rgba(201,166,107,.7);background:transparent;color:var(--ch);font-size:12.5px;font-weight:500;cursor:pointer}
.aj span{font-size:18px;font-weight:400;line-height:1}
.enc{margin-top:14px;border:1px solid rgba(201,166,107,.28);border-radius:16px;overflow:hidden;background:var(--pan)}
.enc.ouv{border-color:rgba(201,166,107,.6)}
.enc-t{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:96px;padding:0 16px 0 0;border:none;background:none;text-align:start;cursor:pointer}
.enc-t .ph{flex:0 0 112px;align-self:stretch;position:relative;overflow:hidden}
.enc-t .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.enc-t .tx{flex:1;min-width:0;padding:14px 0}
.enc-t .tx small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ch)}
.enc-t .tx b{display:block;margin-top:4px;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-t .tx span{display:block;margin-top:4px;font-size:11px;color:var(--iv3)}
.enc-t .chev{flex:0 0 auto;color:var(--ch);font-size:18px;transition:transform .2s}
.enc.ouv .enc-t .chev{transform:rotate(90deg)}
.enc-c{padding:4px 14px 18px}
.mos{column-count:2;column-gap:8px}
.mos .m{width:100%;margin:0 0 8px;break-inside:avoid;border-radius:10px}
.mos .m img{width:100%;height:auto;display:block}
.mos.un{column-count:1}
.note{margin:6px 0 0;font-size:12px;line-height:1.55;color:var(--iv3)}
@media (prefers-reduced-motion:reduce){.enc-t .chev{transition:none}}
@media (min-width:768px){.mos{column-count:3}}
.vue[hidden]{display:none!important}
.partage{display:flex;align-items:center;gap:12px;margin:46px 0 0;padding:10px 2px;border-top:1px solid rgba(201,166,107,.18);border-bottom:1px solid rgba(201,166,107,.18)}
.partage div{flex:1;font-family:var(--serif);font-size:18px;color:rgba(243,238,228,.82)}
.partage span{width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,166,107,.45);display:inline-flex;align-items:center;justify-content:center;color:var(--ch)}
.fin{padding:56px 0 30px}
.fin .im{position:relative;height:118px;overflow:hidden}
.fin .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fin .im:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--noir) 0%,rgba(7,10,8,0) 12%,rgba(7,10,8,0) 88%,var(--noir) 100%)}
.fin .hy{display:flex;align-items:center;gap:14px;padding:6px 24px 0}
.fin .hy i{flex:1;height:1px;background:linear-gradient(90deg,rgba(197,170,120,0),rgba(197,170,120,.55))}
.fin .hy i:last-child{background:linear-gradient(270deg,rgba(197,170,120,0),rgba(197,170,120,.55))}
.fin .hy b{font-family:var(--serif);font-weight:400;font-size:13px;letter-spacing:4px;color:#C5AA78}
button:focus-visible,a:focus-visible{outline:1px solid var(--ch);outline-offset:3px}
@media (min-width:768px){.hero .ph img{max-height:62vh}.cartes{gap:12px}.une-p .m img{max-height:min(70vh,640px)}.galh .m{height:240px}}
</style>
</head>

    h+='</div>';
  });
  h+='<div class="actions" style="justify-content:flex-end"><button type="button" class="aj"><span>+</span> '+(quoi==="photos"?"Ajouter des photos":"Ajouter un parcours")+'</button></div>';
  var el=document.getElementById(boite); el.innerHTML=h;
  el.querySelectorAll(".enc-t").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-c");ouverts[quoi][k]=!ouverts[quoi][k];encarts(boite,quoi)}});
}
function vueTravail(){
  var T=VID.filter(function(v){return !v.c});
  var h='<div class="st"><h2>Vidéos de travail</h2><span>'+plur(T.length,"vidéo","vidéos")+'</span></div><p class="sous">Les séances à la maison, hors concours.</p>';
  h+='<div class="galh">'+T.map(function(v){return '<div class="it">'+media({u:v.v,du:v.du})+'<div class="leg"><b>'+esc(v.cav)+' × '+esc(v.ch)+'</b><span>'+jm(v.dt)+'</span></div></div>'}).join("")+'</div>';
  h+='<div class="actions" style="justify-content:flex-end"><button type="button" class="aj"><span>+</span> Ajouter une vidéo de travail</button></div>';
  document.getElementById("v-travail").innerHTML=h;
}
/* ---------- PAR CAVALIER / PAR CHEVAL : on choisit dans les ronds, ses médias du plus ancien au plus récent ---------- */
var sel={cav:null,ch:null};
function vuePersonne(cle,autre,boite){
  var G={},ordre=[];
  VID.forEach(function(v){var k=v[cle];if(!G[k]){G[k]=[];ordre.push(k)}G[k].push(v)});
  ordre.sort(function(a,b){return G[b].length-G[a].length||a.localeCompare(b)});
  if(!sel[cle])sel[cle]=ordre[0];
  var k=sel[cle], L=G[k].slice().sort(function(a,b){return dt(a).localeCompare(dt(b))});
  var pics=cle==="cav"?AV:CHP;
  var h='<div class="choix">'+ordre.map(function(p){return '<button type="button" class="per'+(p===k?" on":"")+'" data-p="'+esc(p)+'"><i>'+(pics[p]?'<img loading="lazy" src="'+B+pics[p]+'" alt="">':esc(p.charAt(0)))+'</i><span>'+esc(p)+'</span></button>'}).join("")+'</div>';
  var parC={},cles=[];L.forEach(function(v){var c=v.c||("ent-"+v.dt);if(!parC[c]){parC[c]=[];cles.push(c)}parC[c].push(v)});
  var nconc=cles.filter(function(c){return c.indexOf("ent-")!==0}).length;
  h+='<div class="st"><h2>'+esc(k)+'</h2><span>'+plur(L.length,"vidéo","vidéos")+(nconc?" · "+plur(nconc,"concours","concours"):"")+'</span></div>';
  cles.forEach(function(c){
    var co=cO(c), vs=parC[c];
    h+='<div class="etape"><div class="qd">'+jm(dt(vs[0]))+' <small>'+esc(co?co.t:"Entraînement")+'</small></div><div class="galh">'+vs.map(function(v){
      return '<div class="it">'+media({u:v.v,du:v.du})+'<div class="leg"><b>'+esc(v[autre])+'</b><span>'+(v.ep?esc(v.ep):(co?esc(co.l):"&nbsp;"))+'</span>'+(v.res?'<em class="'+(pod(v.res)?"pod":"")+'">'+esc(v.res)+'</em>':'')+'</div></div>'}).join("")+'</div></div>';
  });
  h+='<div class="actions"><a class="lien" href="#">'+(cle==="cav"?"Ses performances":"Ses performances")+' <i>›</i></a><button type="button" class="aj"><span>+</span> Ajouter des médias</button></div>';
  var el=document.getElementById(boite); el.innerHTML=h;
  el.querySelectorAll(".per").forEach(function(b){b.onclick=function(){sel[cle]=b.getAttribute("data-p");vuePersonne(cle,autre,boite)}});
}
encarts("v-parcours","parcours"); vueTravail(); encarts("v-photos","photos"); vuePersonne("cav","ch","v-cavalier");
var cartes=document.querySelectorAll(".carte");
function montrer(v){cartes.forEach(function(t){t.classList.toggle("on",t.getAttribute("data-v")===v)});["parcours","travail","photos","cavalier"].forEach(function(x){document.getElementById("v-"+x).hidden=x!==v})}
cartes.forEach(function(t){t.addEventListener("click",function(){montrer(t.getAttribute("data-v"))})});
var hs=(location.hash||"").slice(1);if(["travail","photos","cavalier"].indexOf(hs)>=0)montrer(hs);
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault()});
})();
</script>
</body>
</html>
