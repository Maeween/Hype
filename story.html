<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hype</title>
<!-- 19/08 (demande de Blandine : « pas de systeme de lien pour cliquer
     dessus ? ») — CARTE DE PREVISUALISATION. Toute la logique JS plus bas
     ne sert a rien pour ces balises : les robots qui construisent
     l'aperçu WhatsApp/Instagram/Facebook ne l'executent jamais, ils lisent
     UNIQUEMENT le HTML brut, tel quel. Donc ces six lignes doivent rester
     statiques, ecrites en dur — pas la meme photo a chaque partage (ça,
     ça demanderait un vrai serveur), mais une image Hype fixe, soignee,
     plutot que rien. Attend un fichier /partage-apercu.jpg a la racine du
     site (1200x630, format attendu par WhatsApp/Facebook) — tant qu'il
     n'existe pas, la carte s'affiche juste sans image, pas casse pour
     autant. */ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hype">
<meta property="og:title" content="Une story sur Hype 🐎">
<meta property="og:description" content="Ton univers équestre : clubs, cavaliers, moments de vie d'écurie.">
<meta property="og:image" content="/partage-apercu.jpg">
<meta name="twitter:card" content="summary_large_image">
<!--
  HYPE ▸ 19/08/2026 (feu vert de Blandine, urgence en direct) — PAGE DE
  PARTAGE PUBLIQUE D'UNE STORY.

  Pourquoi ce fichier existe : un lien partage (#s=<id>) menait vers
  index.html complet — 9 Mo, toute l'app, et surtout le meme mecanisme
  que la navigation connectee. Constat de Blandine : « il ne faut pas
  exiger de connexion pour la partager ou pour l'avoir, sinon personne
  ne va l'avoir ». Une story destinee a quelqu'un HORS de Hype (sa mere,
  au telephone, sans compte) doit s'ouvrir pour n'importe qui.

  Ce fichier est volontairement SEPARE d'index.html : une seule requete
  REST directe (pas le SDK Supabase complet), une seule photo, aucune
  barre de navigation, aucun etat de connexion attendu. Si Supabase
  refuse la lecture anonyme (regle RLS cote base, hors de portee du
  code), la page le dit clairement plutot que de rester blanche —
  c'est la seule chose que ce fichier NE PEUT PAS reparer seul.

  Toujours brande Hype, avec un bouton « Decouvrir Hype » bien visible :
  Blandine a confirme que le but reste de faire decouvrir l'app, pas
  seulement d'afficher une photo nue.

  ─────────────────────────────────────────────────────────────────────
  20/08/2026 (session 142) — RECONSTRUCTION + VISIONNEUSE.

  ⚠️ INCIDENT A CONNAITRE : ce fichier a ete livre une premiere fois en
  session 141 (visionneuse + domaine corrige) mais la livraison n'est
  JAMAIS PARTIE sur GitHub — verifie le 20/08 sur le fichier en ligne,
  qui portait encore l'ancien domaine deux fois et des vignettes muettes.
  Refait ici. Deuxieme point : le fichier n'arrive pas sur le disque des
  sessions (deja le cas en 141), il a donc ete reconstruit depuis la
  copie passee dans la conversation — copie recuperee par Blandine
  directement sur GitHub, donc fiable, mais AUCUNE comparaison md5 n'a
  ete possible.

  CE QUI A CHANGE :
  - Les vignettes de 84 px etaient purement decoratives. Elles ouvrent
    desormais une visionneuse plein ecran. La photo de couverture aussi.
  - Les 2 adresses de l'ancien domaine corrigees (LIEN_APP + bouton
    « Decouvrir Hype »).
  Aucune requete supplementaire : les photos sont deja chargees, la
  visionneuse ne fait que les afficher en grand.
  ───────────────────────────────────────────────────────────────────── -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060709; min-height: 100%; }
  body {
    font-family: 'Montserrat', sans-serif;
    color: #F4F7FA;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 0 0 40px;
  }
  .entete {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 18px) 0 14px;
  }
  .marque {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D6DC 45%, #8FA6AF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .scene { width: 100%; max-width: 460px; padding: 0 18px; }

  .carte {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #0c0f13;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .carte img {
    width: 100%;
    display: block;
    max-height: 78vh;
    object-fit: contain;
    background: #04070d;
  }
  /* La couverture s'ouvre aussi : le doigt doit sentir qu'elle est tapable. */
  .carte img.ouvrable { cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
  .auteur-bandeau {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 15px;
  }
  .av {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(32,217,245,0.14);
    border: 1px solid rgba(32,217,245,0.35);
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .nom-auteur { font-size: 13.5px; font-weight: 700; color: #F4F7FA; line-height: 1.2; }
  .sous-ligne { font-size: 11.5px; color: #8A929C; margin-top: 1px; }

  .legende {
    padding: 0 15px 16px;
    font-size: 14px;
    line-height: 1.55;
    color: #D6DCE1;
    white-space: pre-wrap;
  }
  .lieu {
    display: flex; align-items: center; gap: 5px;
    padding: 0 15px 16px;
    font-size: 12.5px;
    color: #7FCBD6;
  }

  .tirages {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .tirage {
    flex: 0 0 auto;
    width: 84px;
    height: 84px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .tirage img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .cta {
    margin-top: 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .cta-phrase {
    font-size: 12.5px;
    color: #8A929C;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .cta a {
    display: block;
    width: 100%;
    padding: 15px 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #1FB8C4, #5FE9F0);
    color: #04252A;
    font-size: 14.5px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(32,217,245,0.22);
  }

  .etat {
    display: flex; flex-direction: column; align-items: center;
    padding: 90px 30px 0;
    text-align: center;
  }
  .etat .titre { font-family: 'Cinzel', serif; font-size: 17px; color: #F4F7FA; margin-bottom: 10px; }
  .etat .texte { font-size: 13.5px; color: #8A929C; line-height: 1.6; max-width: 300px; }

  .halo {
    position: absolute; top: -60px; left: 50%; width: 320px; height: 320px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(32,217,245,0.14) 0%, rgba(32,217,245,0) 70%);
    pointer-events: none;
  }

  /* ── LA VISIONNEUSE ──────────────────────────────────────────────
     Couche plein ecran, fond noir presque opaque, la photo au centre en
     `contain` pour ne jamais rogner. Les commandes sont posees PAR-DESSUS
     mais en dehors de la photo autant que possible : la croix en haut a
     droite dans la zone de securite, le compteur en bas au centre, les
     fleches sur les cotes verticalement centrees. Le fond entier ferme au
     tap — c'est le geste attendu et il n'exige aucune precision. */
  .visio {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(3,5,8,0.96);
    display: none;
    align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .visio.on { display: flex; }
  .visio img {
    max-width: 100%;
    max-height: calc(100vh - 140px);
    object-fit: contain;
    display: block;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .v-fermer {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 12px);
    right: 14px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(18,24,32,0.75);
    color: #F4F7FA;
    font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .v-fleche {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(18,24,32,0.75);
    color: #F4F7FA;
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .v-prec { left: 10px; }
  .v-suiv { right: 10px; }
  .v-compteur {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 50%; transform: translateX(-50%);
    font-size: 12.5px; font-weight: 600;
    color: #C9D6DC;
    background: rgba(18,24,32,0.8);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 6px 14px;
  }
</style>
</head>
<body>

<div class="entete"><span class="marque">HYPE</span></div>
<div class="scene" id="scene">
  <div class="etat" id="etatChargement">
    <div class="titre">Ouverture&hellip;</div>
  </div>
</div>

<div class="cta" id="zoneCta" style="display:none;">
  <p class="cta-phrase">Rejoins l'univers équestre de Hype pour ne plus rien manquer.</p>
  <a href="https://2hype.netlify.app">Découvrir Hype</a>
</div>

<!-- La visionneuse vit hors de #scene : #scene est reecrit entierement par
     innerHTML a chaque etat, elle serait effacee avec. -->
<div class="visio" id="visio">
  <button class="v-fermer" id="vFermer" aria-label="Fermer">&times;</button>
  <button class="v-fleche v-prec" id="vPrec" aria-label="Photo précédente">&lsaquo;</button>
  <img id="vImage" src="" alt="">
  <button class="v-fleche v-suiv" id="vSuiv" aria-label="Photo suivante">&rsaquo;</button>
  <div class="v-compteur" id="vCompteur"></div>
</div>

<script>
(function () {
  var SUPABASE_URL = "https://ldpjebgtskzdokrublfg.supabase.co";
  var CLE = "sb_publishable_OoSj7bDnqn2O36myBAXF1g_VjPki8TK";
  var LIEN_APP = "https://2hype.netlify.app";

  function param(nom) {
    try {
      var u = new URL(window.location.href);
      return u.searchParams.get(nom);
    } catch (e) { return null; }
  }

  function echapper(txt) {
    var d = document.createElement("div");
    d.textContent = txt == null ? "" : String(txt);
    return d.innerHTML;
  }

  function afficherEtat(titre, texte) {
    document.getElementById("scene").innerHTML =
      '<div class="etat"><div class="titre">' + echapper(titre) + '</div>' +
      (texte ? '<div class="texte">' + echapper(texte) + '</div>' : '') + '</div>';
    document.getElementById("zoneCta").style.display = "block";
  }

  function dateLisible(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
    } catch (e) { return ""; }
  }

  async function requeteRest(chemin) {
    var r = await fetch(SUPABASE_URL + "/rest/v1/" + chemin, {
      headers: { "apikey": CLE, "Authorization": "Bearer " + CLE }
    });
    if (!r.ok) throw new Error("http-" + r.status);
    return await r.json();
  }

  /* ── LA VISIONNEUSE ────────────────────────────────────────────────
     20/08 (demande de Blandine : « fais en sorte que quand on partage une
     story les images du bas puissent s'ouvrir en grand »).
     `galerie` est rempli une fois la story affichee : couverture EN
     PREMIER, puis les autres dans l'ordre chronologique — le meme ordre
     que la bande de vignettes, pour que l'index d'une vignette soit
     directement son rang dans la galerie.
     Aucune requete : ces adresses sont deja celles des <img> de la page,
     donc deja en cache du navigateur. */
  var galerie = [];
  var iVisio = 0;
  var elVisio = document.getElementById("visio");
  var elVImage = document.getElementById("vImage");
  var elVCompteur = document.getElementById("vCompteur");
  var elVPrec = document.getElementById("vPrec");
  var elVSuiv = document.getElementById("vSuiv");

  function peindreVisio() {
    if (!galerie.length) return;
    if (iVisio < 0) iVisio = galerie.length - 1;
    if (iVisio >= galerie.length) iVisio = 0;
    elVImage.src = galerie[iVisio];
    elVCompteur.textContent = (iVisio + 1) + " / " + galerie.length;
    /* Une seule photo : les fleches et le compteur n'ont rien a dire. */
    var multi = galerie.length > 1;
    elVPrec.style.display = multi ? "flex" : "none";
    elVSuiv.style.display = multi ? "flex" : "none";
    elVCompteur.style.display = multi ? "block" : "none";
  }

  function ouvrirVisio(i) {
    if (!galerie.length) return;
    iVisio = i || 0;
    peindreVisio();
    elVisio.classList.add("on");
    /* Le fond ne doit pas defiler derriere la couche plein ecran. */
    try { document.body.style.overflow = "hidden"; } catch (e) { }
  }

  function fermerVisio() {
    elVisio.classList.remove("on");
    try { elVImage.src = ""; } catch (e) { }
    try { document.body.style.overflow = ""; } catch (e) { }
  }

  document.getElementById("vFermer").addEventListener("click", function (ev) { ev.stopPropagation(); fermerVisio(); });
  elVPrec.addEventListener("click", function (ev) { ev.stopPropagation(); iVisio--; peindreVisio(); });
  elVSuiv.addEventListener("click", function (ev) { ev.stopPropagation(); iVisio++; peindreVisio(); });
  /* Tap sur le fond = fermer. Le tap sur la photo elle-meme ne ferme pas :
     on peut vouloir la regarder sans la perdre d'un doigt mal place. */
  elVisio.addEventListener("click", function (ev) { if (ev.target === elVisio) fermerVisio(); });
  elVImage.addEventListener("click", function (ev) { ev.stopPropagation(); });
  document.addEventListener("keydown", function (ev) {
    if (!elVisio.classList.contains("on")) return;
    if (ev.key === "Escape") fermerVisio();
    else if (ev.key === "ArrowLeft") { iVisio--; peindreVisio(); }
    else if (ev.key === "ArrowRight") { iVisio++; peindreVisio(); }
  });

  async function demarrer() {
    var id = param("id");
    if (!id) { afficherEtat("Lien incomplet", "Cette adresse ne pointe vers aucune story."); return; }

    var story;
    try {
      var lignes = await requeteRest(
        "hype_stories?id=eq." + encodeURIComponent(id) +
        "&select=id,user_id,photo_url,legende,lieu,ecurie,expire_le,created_at,groupe,disposition"
      );
      story = lignes && lignes[0];
    } catch (eReq) {
      /* Une erreur reseau/HTTP peut aussi vouloir dire que la lecture
         anonyme est refusee cote Supabase (regle RLS) — voir le
         commentaire d'entete : ce fichier ne peut pas corriger cela
         lui-meme, seule Blandine peut ajuster la politique de la table. */
      afficherEtat("Impossible d'ouvrir cette story", "Réessaie dans un instant, ou ouvre-la directement dans Hype.");
      return;
    }

    if (!story) { afficherEtat("Story introuvable", "Elle a peut-être été retirée."); return; }
    if (story.expire_le && new Date(story.expire_le).getTime() < Date.now()) {
      afficherEtat("Cette story n'est plus visible", "Les stories Hype restent en ligne quelques jours seulement.");
      return;
    }

    /* 19/08 (feu vert de Blandine, en direct : « on voit qu'une photo alors
       qu'il y en a plein ») — LES STORIES COMPOSEES. Le partage n'attache
       et ne pointe que vers UNE ligne (celle ouverte au moment du tap sur
       Partager) ; les autres photos de la meme composition vivent dans
       d'autres lignes, reliees par `groupe`. Meme convention que
       hsRegrouperCompos (hype-stories.js) : trie par date de creation, la
       couverture est celle qui porte une `disposition`, sinon la plus
       ancienne — cette page ne decide de rien de nouveau, elle recopie la
       regle deja en place pour que couverture et legende restent les memes
       qu'affichees dans l'app. */
    var membres = [story];
    if (story.groupe) {
      try {
        var groupe = await requeteRest(
          "hype_stories?groupe=eq." + encodeURIComponent(story.groupe) +
          "&select=id,photo_url,legende,lieu,ecurie,created_at,disposition,expire_le" +
          "&order=created_at.asc"
        );
        if (groupe && groupe.length) {
          membres = groupe.filter(function (m) {
            return !m.expire_le || new Date(m.expire_le).getTime() >= Date.now();
          });
          if (!membres.length) membres = [story];
        }
      } catch (eG) { /* echec silencieux : on retombe sur la seule photo partagee */ }
    }
    var couverture = membres.filter(function (m) { return m && m.disposition; })[0] || membres[0];
    story = Object.assign({}, story, couverture);

    var auteur = null;
    try {
      var profils = await requeteRest(
        "profiles?id=eq." + encodeURIComponent(story.user_id) + "&select=pseudo,avatar_url,handle"
      );
      auteur = profils && profils[0];
    } catch (eP) { auteur = null; }

    var nomAuteur = (auteur && auteur.pseudo) ? auteur.pseudo : "Un cavalier Hype";
    var avatarUrl = auteur && auteur.avatar_url;
    var sousLigne = (story.ecurie ? story.ecurie : "Hype") + " · " + dateLisible(story.created_at);

    /* Bande des autres photos : toutes SAUF la couverture deja affichee en
       grand, dans leur ordre chronologique. Vide (donc invisible) pour une
       story simple, sans composition — rien ne change pour ce cas, le plus
       courant. */
    var autres = membres.filter(function (m) { return m && m.id !== couverture.id; });
    var bandeTirages = autres.length
      ? '<div class="tirages">' + autres.map(function (m, k) {
          return '<div class="tirage" data-i="' + (k + 1) + '"><img src="' + echapper(m.photo_url) + '" alt=""></div>';
        }).join('') + '</div>'
      : '';

    /* La galerie de la visionneuse : couverture d'abord, puis les autres.
       L'index 0 est donc la couverture, et `data-i` d'une vignette vaut
       son rang + 1 — d'ou le (k + 1) ci-dessus. */
    galerie = [couverture.photo_url].concat(autres.map(function (m) { return m.photo_url; }));

    var html = ''
      + '<div class="carte">'
      +   '<img class="ouvrable" id="imgCouv" src="' + echapper(story.photo_url) + '" alt="">'
      +   '<div class="auteur-bandeau">'
      +     '<div class="av" style="' + (avatarUrl ? 'background-image:url(' + echapper(avatarUrl) + ')' : '') + '"></div>'
      +     '<div><div class="nom-auteur">' + echapper(nomAuteur) + '</div><div class="sous-ligne">' + echapper(sousLigne) + '</div></div>'
      +   '</div>'
      +   (story.legende ? '<div class="legende">' + echapper(story.legende) + '</div>' : '')
      +   (story.lieu ? '<div class="lieu">📍 ' + echapper(story.lieu) + '</div>' : '')
      + '</div>'
      + bandeTirages;

    document.getElementById("scene").innerHTML = html;
    document.getElementById("zoneCta").style.display = "block";

    /* Les gestionnaires sont poses APRES l'ecriture du innerHTML : avant,
       les elements n'existent pas encore. */
    try {
      var couv = document.getElementById("imgCouv");
      if (couv) couv.addEventListener("click", function () { ouvrirVisio(0); });
      var vign = document.querySelectorAll(".tirage");
      for (var k = 0; k < vign.length; k++) {
        (function (el) {
          el.addEventListener("click", function () {
            ouvrirVisio(parseInt(el.getAttribute("data-i"), 10) || 0);
          });
        })(vign[k]);
      }
    } catch (eH) { }

    try {
      document.title = nomAuteur + " sur Hype";
    } catch (eT) { }
  }

  demarrer();
})();
</script>
</body>
</html>
