<!-- 19/08 (demande de Blandine : « pas de systeme de lien pour cliquer
     dessus ? ») — CARTE DE PREVISUALISATION. Toute la logique JS plus bas
     ne sert a rien pour ces balises : les robots qui construisent
     l'aperçu WhatsApp/Instagram/Facebook ne l'executent jamais, ils lisent
     UNIQUEMENT le HTML brut, tel quel. Donc ces six lignes doivent rester
     statiques, ecrites en dur — pas la meme photo a chaque partage (ça,
     ça demanderait un vrai serveur), mais une image Hype fixe, soignee,
     plutot que rien. Attend un fichier /partage-apercu.jpg a la racine du
     site (1200x630, format attendu par WhatsApp/Facebook) — tant qu'il
     n'existe pas, la carte s'affiche juste sans image, pas casse pour
     autant.

     31/08 — VERIFICATION DEMANDEE PAR BLANDINE, RIEN N'EST TOUCHE ICI.
     og:title, og:description et og:image sont bien presents et corrects.
     og:url est VOLONTAIREMENT ABSENT : sa valeur devrait etre l'adresse
     exacte de CETTE story (…/story.html?id=xxxx), or une balise statique
     ne peut porter qu'une seule adresse pour toutes les stories — un
     og:url en dur ferait pointer l'apercu vers la mauvaise page. Il n'a
     de sens que le jour ou ces balises seront ecrites cote serveur.
     La vraie premiere photo en og:image demande la meme chose : voir la
     note « APERCU DYNAMIQUE » plus bas dans le fichier. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hype">

<meta property="og:description" content="Ton univers équestre : clubs, cavaliers, moments de vie d'écurie.">
<meta property="og:image" content="https://2hype.fr/partage-apercu.jpg">

     og:image par la PHOTO DE LA STORY quand elle la trouve. Pas de og:image:width/height ici : ils mentiraient sur la photo de la story. -->

<!--
  HYPE ▸ 19/08/2026 (feu vert de Blandine, urgence en direct) — PAGE DE
  PARTAGE PUBLIQUE D'UNE STORY.

  Pourquoi ce fichier existe : un lien partage (#s=<id>) menait vers
  index.html complet — 9 Mo, toute l'app, et surtout le meme mecanisme
  que la navigation connectee. Constat de Blandine : « il ne faut pas
  exiger de connexion pour la partager ou pour l'avoir, sinon personne
  ne va l'avoir ». Une story destinee a quelqu'un HORS de Hype (sa mere,
  au telephone, sans compte) doit s'ouvrir pour n'importe qui.

  Ce fichier est volontairement SEPARE d'index.html : des requetes REST
  directes (pas le SDK Supabase complet), aucune barre de navigation,
  aucun etat de connexion attendu. Si Supabase refuse la lecture anonyme
  (regle RLS cote base, hors de portee du code), la page le dit
  clairement plutot que de rester blanche — c'est la seule chose que ce
  fichier NE PEUT PAS reparer seul.

  ─────────────────────────────────────────────────────────────────────
  20/08/2026 (session 142) — RECONSTRUCTION + VISIONNEUSE.
  Les vignettes ouvrent une visionneuse plein ecran ; les 2 adresses de
  l'ancien domaine corrigees.

  ─────────────────────────────────────────────────────────────────────
  31/08/2026 — REFONTE DE LA PRESENTATION (brief de Blandine, 7 points
  tranches un par un). LA DONNEE N'EST PAS TOUCHEE : memes requetes,
  meme regle de couverture, memes messages d'erreur. Seule la mise en
  scene change.

  Ce qui disparait volontairement :
  - la CARTE anthracite qui enfermait tout (bordure, coins, ombre) ;
  - le BANDEAU « HYPE » en haut de page : il poussait la photo vers le
    bas et faisait passer Hype avant la story. Hype signe en bas ;
  - la BANDE DE VIGNETTES 84 px sous la photo (et donc, mecaniquement,
    la case vide qui gene Blandine) ;
  - la phrase « Rejoins l'univers equestre… », jugee publicitaire.

  Ce qui arrive :
  - une PELLICULE horizontale : la grande photo se swipe comme dans
    l'app, une photo par ecran, calage magnetique (scroll-snap). Aucun
    emplacement n'est genere pour une photo qui n'existe pas ;
  - des JAUGES tres fines en haut de l'image, exactement autant que de
    medias reels ;
  - l'auteur, le club et la date poses SUR le bas de la photo ;
  - le texte replie au-dela de 4 lignes derriere « Voir plus » ;
  - l'identite du club, avec ses vrais chiffres quand la base accepte de
    les donner — SANS lien, voir « LE CLUB — IDENTITE SEULE » ;
  - la signature Hype et le bouton, en fin de page seulement.

  Sur iPhone, au premier ecran : la photo (60svh), l'auteur, et le
  debut du texte. Le bouton Hype est sous la ligne de flottaison, par
  construction — c'est demande.
  ───────────────────────────────────────────────────────────────────── -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@500;700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@500;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060709; min-height: 100%; }
  body {
    font-family: 'Montserrat', sans-serif;
    color: #F4F7FA;
    min-height: 100vh;
    padding: 0 0 42px;
    overflow-x: hidden;
  }
  /* Une seule colonne, bord a bord sur telephone, recentree au-dela :
     sur un grand ecran une photo pleine largeur serait ridicule. */
  .scene { width: 100%; max-width: 470px; margin: 0 auto; }

  /* ── LA PHOTO ──────────────────────────────────────────────────────
     Le hero occupe 60svh (svh et non vh : sur iOS, vh compte la barre
     d'adresse retractee et la photo depasserait au chargement).
     `cover` remplit sans jamais deformer ; le cadrage est legerement
     remonte (50% 45%) car sur une photo de concours le sujet — cavalier,
     tete du cheval — est presque toujours au-dessus du milieu. */
  .photo-zone { position: relative; width: 100%; height: 60svh; min-height: 340px; background: #04070d; }
  @supports not (height: 60svh) { .photo-zone { height: 60vh; } }

  .pellicule {
    display: flex;
    width: 100%; height: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .pellicule::-webkit-scrollbar { display: none; }
  /* 31/08 (retour de Blandine sur iPhone : « toutes les photos sont
     decoupees en haut ») — PLUS AUCUNE COUPE. `cover` remplissait le
     cadre en rognant, et sur une photo verticale ou un cavalier cadre
     haut, c'est la tete qui saute. La photo passe en `contain` : elle
     est montree ENTIERE, quel que soit son format. Le vide autour est
     comble par la meme photo, floutee et assombrie — le cadre reste
     plein et immersif, mais plus rien n'est perdu. */
  .vue { position: relative; flex: 0 0 100%; width: 100%; height: 100%; overflow: hidden; scroll-snap-align: center; scroll-snap-stop: always; }
  .vue .flou {
    position: absolute; inset: -10%;
    background-size: cover; background-position: center;
    filter: blur(26px) brightness(0.5) saturate(1.1);
    transform: scale(1.12);
    pointer-events: none;
  }
  .vue img {
    position: relative;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }

  /* Le fondu qui rend l'identite lisible quelle que soit la photo. */
  .voile {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
    background: linear-gradient(180deg, rgba(6,7,9,0) 0%, rgba(6,7,9,0.55) 55%, rgba(6,7,9,0.92) 100%);
    pointer-events: none;
  }

  /* Jauges : une par media reel, jamais plus. Elles restent tres
     discretes tant qu'il n'y a rien a compter (une seule photo -> pas
     de jauge du tout, voir le JS). */
  .jauges {
    position: absolute; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top) + 10px);
    display: flex; gap: 4px;
    pointer-events: none;
  }
  .jauge { flex: 1 1 0; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.26); transition: background .25s ease; }
  .jauge.active { background: rgba(255,255,255,0.92); }

  /* Identite de l'auteur, posee SUR la photo.
     31/08 — OPTION B, TOUT EST CENTRE. La page melangeait trois regimes
     (photo bord a bord, texte en retrait de 18 px, HYPE centre) : aucun
     axe vertical auquel se raccrocher. Un seul axe desormais, du bas de
     la photo jusqu'au bouton. */
  .signature {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 0 20px 14px;
    text-align: center;
    pointer-events: none;
  }
  .av {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(32,217,245,0.12);
    border: 1px solid rgba(255,255,255,0.34);
    background-size: cover; background-position: center;
    flex-shrink: 0;
  }
  .nom-auteur { font-size: 14px; font-weight: 600; color: #FFFFFF; line-height: 1.2; text-shadow: 0 1px 10px rgba(0,0,0,0.55); }
  .sous-ligne { font-size: 11.5px; font-weight: 400; color: rgba(233,240,244,0.72); margin-top: 2px; text-shadow: 0 1px 10px rgba(0,0,0,0.55); }

  /* Fleches : uniquement la ou il y a une souris. Sur telephone, le
     doigt suffit et deux pastilles de plus abimeraient la photo. */
  .fleche { display: none; }
  @media (hover: hover) and (pointer: fine) {
    .fleche {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10,14,19,0.55);
      color: #EDF2F5; font-size: 17px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity .2s ease;
    }
    .photo-zone:hover .fleche { opacity: 0.82; }
    .f-prec { left: 10px; }
    .f-suiv { right: 10px; }
  }

  /* ── LE TEXTE ──────────────────────────────────────────────────────
     Plus aucun encadre : le texte est pose sur le noir, comme dans
     l'app. La tete de legende porte, la suite s'efface. */
  .texte { padding: 18px 20px 0; text-align: center; }
  .texte .corps {
    font-size: 15px; line-height: 1.6; color: #E4EAEE;
    white-space: pre-wrap; word-break: break-word;
    max-width: 30em; margin: 0 auto;
  }
  .texte .corps .suite { font-size: 13.5px; color: #98A2AB; }
  /* 31/08 (retour de Blandine) : le repli a 4 lignes coupait un
     remerciement de deux phrases — « je prefere largement voir les deux
     paragraphes complets ». Le repli ne concerne plus que les textes
     REELLEMENT longs : au-dela de 500 caracteres, et il en laisse alors
     voir 8 lignes. */
  .corps.replie {
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 8; overflow: hidden;
  }
  .voir-plus {
    display: inline-block; margin-top: 7px;
    background: none; border: 0; padding: 0;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: #7FCBD6; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .lieu {
    padding: 15px 20px 0;
    font-size: 12.5px; color: #7FCBD6;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }

  /* ── LE CLUB ───────────────────────────────────────────────────────
     Un filet, trois lignes, rien de plus : cet acces doit inviter, pas
     concurrencer le bouton Hype. */
  .club { margin: 28px 20px 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.07); text-align: center; }
  .club-nom { font-family: 'Cinzel', serif; font-size: 13.5px; letter-spacing: .06em; color: #E3EAEE; }
  .club-nom .certif { color: #5FE9F0; font-size: 11.5px; margin-left: 4px; }
  .club-chiffres { font-size: 11.5px; color: #7C858E; margin-top: 3px; }

  /* ── HYPE, EN DERNIER ──────────────────────────────────────────── */
  .fin { margin: 40px auto 0; padding: 0 20px; text-align: center; }
  .marque {
    font-family: 'Cinzel', serif;
    font-size: 19px; font-weight: 600; letter-spacing: 7px;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D6DC 45%, #8FA6AF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .baseline { font-size: 11px; color: #7C858E; letter-spacing: .1em; margin-top: 8px; }
  .fin a {
    display: inline-block; margin-top: 18px;
    padding: 12px 26px; border-radius: 999px;
    background: linear-gradient(90deg, #1FB8C4, #5FE9F0);
    color: #04252A; font-size: 13.5px; font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 22px rgba(32,217,245,0.18);
  }

  /* i18n : en arabe la page passe en dir="rtl" (texte), mais la pellicule, les
     jauges et la visionneuse restent en ltr : le calcul du defilement
     (scrollLeft / largeur) suppose ce sens. */
  [dir="rtl"] .pellicule, [dir="rtl"] .jauges, [dir="rtl"] .visio { direction: ltr; }

  .etat { display: flex; flex-direction: column; align-items: center; padding: 90px 30px 0; text-align: center; }
  .etat .titre { font-family: 'Cinzel', serif; font-size: 17px; color: #F4F7FA; margin-bottom: 10px; }
  .etat .texte-etat { font-size: 13.5px; color: #8A929C; line-height: 1.6; max-width: 300px; }

  /* ── LA VISIONNEUSE ────────────────────────────────────────────────
     Conservee telle quelle (elle date du 20/08) : le hero est en `cover`,
     donc rogne ; un tap sur la photo la montre entiere. Elle ne s'ouvre
     que sur un VRAI tap, jamais a la fin d'un swipe — voir `depart` dans
     le JS. */
  .visio {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(3,5,8,0.96);
    display: none; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .visio.on { display: flex; }
  .visio img {
    max-width: 100%; max-height: calc(100vh - 140px);
    object-fit: contain; display: block; border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .v-fermer {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(18,24,32,0.75);
    color: #F4F7FA; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .v-fleche {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(18,24,32,0.75);
    color: #F4F7FA; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .v-prec { left: 10px; }
  .v-suiv { right: 10px; }
  .v-compteur {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 20px);
    left: 50%; transform: translateX(-50%);
    font-size: 12.5px; font-weight: 600; color: #C9D6DC;
    background: rgba(18,24,32,0.8); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 6px 14px;
  }
</style>

  function t(cle) { var d = TR[LANG] || TR.fr; return d[cle] != null ? d[cle] : TR.fr[cle]; }

      el = document.getElementById("vSuiv"); if (el) el.setAttribute("aria-label", t("suiv"));
      /* Balises d'apercu : on ne touche que celles qui portent encore le

      var og = document.querySelector('meta[property="og:title"]');

  })();

  function echapper(txt) {
    var d = document.createElement("div");
    d.textContent = txt == null ? "" : String(txt);
    return d.innerHTML;
  }

  async function requeteRest(chemin) {
    var r = await fetch(SUPABASE_URL + "/rest/v1/" + chemin, {
      headers: { "apikey": CLE, "Authorization": "Bearer " + CLE }
    });
    if (!r.ok) throw new Error("http-" + r.status);
    return await r.json();
  }

  /* ── LE POIDS DES PHOTOS ───────────────────────────────────────────
     31/08 — la meme regle que l'app (bloc pose avant </body> dans
     index.html) : les photos envoyees depuis le relevement de la limite
     du bucket pesent 2 a 4,5 Mo, et cette page en affichait l'original.
     Sur un lien ouvert en 4G par quelqu'un qui ne connait pas Hype,
     c'est la premiere impression qui se joue.
     ⚠️ `resize=contain` est INDISPENSABLE : sans lui, le point de
     transformation Supabase recadre et toutes les photos ressortent
     zoomees (erreur deja payee le 30/08).
     Si la transformation est refusee (plan Free), `onerror` repose
     l'adresse d'origine : on perd le gain, jamais la photo.

     31/08 (retour de Blandine) — QUALITE D'ABORD, POIDS ENSUITE. Le
     premier reglage (1080 px, qualite 72) etait un reglage de vignette :
     sur un ecran Retina, ou un point CSS vaut 2 a 3 pixels reels, une
     photo de 1080 px etiree sur toute la largeur devient molle. Le hero
     passe donc a 1600 px et qualite 88 — net sur iPhone, sans revenir
     aux 2 a 4,5 Mo de l'original. La visionneuse, elle, ne passe plus du
     tout par la transformation : elle affiche l'ORIGINAL (voir
     `galerie`), puisque c'est la qu'on veut tout voir. */
  function urlRendu(u, largeur, qualite) {
    try {
      var s = String(u || "");
      if (!s || s.indexOf("/storage/v1/object/public/") < 0) return s;
      if (s.indexOf("/render/image/") >= 0) return s;
      return s.replace("/storage/v1/object/public/", "/storage/v1/render/image/public/")
        + (s.indexOf("?") >= 0 ? "&" : "?") + "width=" + largeur + "&resize=contain&quality=" + (qualite || 88);
    } catch (e) { return String(u || ""); }
  }

  /* ── LA VISIONNEUSE ────────────────────────────────────────────────
     `galerie` est rempli une fois la story affichee, dans l'ordre exact
     de la pellicule : couverture d'abord. L'index d'une vue est donc
     directement son rang dans la galerie. */
  var galerie = [];
  var iVisio = 0;
  var elVisio = document.getElementById("visio");
  var elVImage = document.getElementById("vImage");
  var elVCompteur = document.getElementById("vCompteur");
  var elVPrec = document.getElementById("vPrec");
  var elVSuiv = document.getElementById("vSuiv");

  function peindreVisio() {
    if (!galerie.length) return;
    if (iVisio < 0) iVisio = galerie.length - 1;
    if (iVisio >= galerie.length) iVisio = 0;
    elVImage.src = galerie[iVisio];
    elVCompteur.textContent = (iVisio + 1) + " / " + galerie.length;
    var multi = galerie.length > 1;
    elVPrec.style.display = multi ? "flex" : "none";
    elVSuiv.style.display = multi ? "flex" : "none";
    elVCompteur.style.display = multi ? "block" : "none";
  }

  function ouvrirVisio(i) {
    if (!galerie.length) return;
    iVisio = i || 0;
    peindreVisio();
    elVisio.classList.add("on");
    try { document.body.style.overflow = "hidden"; } catch (e) { }
  }

  function fermerVisio() {
    elVisio.classList.remove("on");
    try { elVImage.src = ""; } catch (e) { }
    try { document.body.style.overflow = ""; } catch (e) { }
  }

  document.getElementById("vFermer").addEventListener("click", function (ev) { ev.stopPropagation(); fermerVisio(); });
  elVPrec.addEventListener("click", function (ev) { ev.stopPropagation(); iVisio--; peindreVisio(); });
  elVSuiv.addEventListener("click", function (ev) { ev.stopPropagation(); iVisio++; peindreVisio(); });
  elVisio.addEventListener("click", function (ev) { if (ev.target === elVisio) fermerVisio(); });
  elVImage.addEventListener("click", function (ev) { ev.stopPropagation(); });
  document.addEventListener("keydown", function (ev) {
    if (!elVisio.classList.contains("on")) return;
    if (ev.key === "Escape") fermerVisio();
    else if (ev.key === "ArrowLeft") { iVisio--; peindreVisio(); }
    else if (ev.key === "ArrowRight") { iVisio++; peindreVisio(); }
  });

  /* ── LES CHIFFRES DU CLUB ──────────────────────────────────────────
     31/08 — « utilise les vraies donnees si elles existent, ne hardcode
     evidemment pas ». Recopie exacte de la methode de la page club
     (EcranGuilde, index.html ~28786) : le nom d'ecurie est du texte
     libre, on cherche donc par motif ILIKE construit sur le noyau du
     nom, sur `ecurie` PUIS `ecurie2`, puis les chevaux des membres
     trouves.
     Ce que la page NE FAIT PAS : afficher un zero. Si une des deux
     requetes echoue (politique RLS absente sur `chevaux` pour le role
     anonyme, par exemple) ou renvoie vide, la ligne de chiffres ne
     s'affiche pas du tout. Un « 0 cavalier » sur un club vivant serait
     pire que pas de chiffre. */
  function noyauEcurie(nom) {
    try {
      var s = String(nom || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\b(ecurie|ecuries|centre|equestre|club|hippique|poney|les|le|la|de|du|des|d)\b/g, " ");
      s = s.replace(/\s+/g, " ").trim();
      return s;
    } catch (e) { return ""; }
  }
  function motifEcurie(nom) {
    /* Les caracteres speciaux sont retires avant d'entrer dans le filtre :
       une virgule ou une parenthese dans un nom de club casserait la
       syntaxe PostgREST. */
    var n = noyauEcurie(nom);
    if (!n) n = String(nom || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
    if (!n) return "";
    return "%" + n.split(" ").join("%") + "%";
  }

  async function chiffresDuClub(nomClub) {
    var out = { cavaliers: 0, chevaux: 0 };
    var motif = motifEcurie(nomClub);
    if (!motif) return out;
    var mo = encodeURIComponent(motif);
    var ids = {}, n = 0;
    try {
      var a = await requeteRest("profiles?ecurie=ilike." + mo + "&select=id&limit=200");
      (a || []).forEach(function (p) { if (p && p.id && !ids[p.id]) { ids[p.id] = 1; n++; } });
    } catch (e1) { }
    try {
      var b = await requeteRest("profiles?ecurie2=ilike." + mo + "&select=id&limit=200");
      (b || []).forEach(function (p) { if (p && p.id && !ids[p.id]) { ids[p.id] = 1; n++; } });
    } catch (e2) { }
    out.cavaliers = n;
    if (n) {
      try {
        var liste = Object.keys(ids).join(",");
        var c = await requeteRest("chevaux?user_id=in.(" + liste + ")&supprime_le=is.null&select=id&limit=1000");
        out.chevaux = (c || []).length;
      } catch (e3) { }
    }
    return out;
  }
  
  async function demarrer() {
    var id = param("id");
    if (!id) { afficherEtat(t("lienT"), t("lienD")); return; }

    var story;
    try {
      var lignes = await requeteRest(
        "hype_stories?id=eq." + encodeURIComponent(id) +
        "&select=id,user_id,photo_url,legende,style_legende,lieu,ecurie,expire_le,created_at,groupe,disposition"
      );
      story = lignes && lignes[0];
    } catch (eReq) {
      /* Une erreur reseau/HTTP peut aussi vouloir dire que la lecture
         anonyme est refusee cote Supabase (regle RLS) — voir le
         commentaire d'entete : ce fichier ne peut pas corriger cela
         lui-meme, seule Blandine peut ajuster la politique de la table. */
      afficherEtat(t("erreurT"), t("erreurD"));
      return;
    }

    if (!story) { afficherEtat(t("introT"), t("introD")); return; }
    if (story.expire_le && new Date(story.expire_le).getTime() < Date.now()) {
      afficherEtat(t("expT"), t("expD"));
      return;
    }

    /* 19/08 — LES STORIES COMPOSEES. Le partage ne pointe que vers UNE
       ligne ; les autres photos de la meme composition vivent dans
       d'autres lignes, reliees par `groupe`. Meme convention que
       hsRegrouperCompos (hype-stories.js) : tri par date de creation, la
       couverture est celle qui porte une `disposition`, sinon la plus
       ancienne. Cette page ne decide de rien de nouveau. */
    var membres = [story];
    if (story.groupe) {
      try {
        var groupe = await requeteRest(
          "hype_stories?groupe=eq." + encodeURIComponent(story.groupe) +
          "&select=id,photo_url,legende,style_legende,lieu,ecurie,created_at,disposition,expire_le" +
          "&order=created_at.asc"
        );
        if (groupe && groupe.length) {
          membres = groupe.filter(function (m) {
            return !m.expire_le || new Date(m.expire_le).getTime() >= Date.now();
          });
          if (!membres.length) membres = [story];
        }
      } catch (eG) { /* echec silencieux : on retombe sur la seule photo partagee */ }
    }
    var couverture = membres.filter(function (m) { return m && m.disposition; })[0] || membres[0];
    story = Object.assign({}, story, couverture);

    var auteur = null;
    try {
      var profils = await requeteRest(
        "profiles?id=eq." + encodeURIComponent(story.user_id) + "&select=pseudo,avatar_url,handle"
      );
      auteur = profils && profils[0];
    } catch (eP) { auteur = null; }

    var nomAuteur = (auteur && auteur.pseudo) ? auteur.pseudo : t("anonyme");
    var avatarUrl = auteur && auteur.avatar_url;
    var nomClub = (story.ecurie && String(story.ecurie).trim() && String(story.ecurie).trim() !== "__perso__") ? String(story.ecurie).trim() : "";
    var sousLigne = (nomClub ? nomClub : "Hype") + " · " + dateLisible(story.created_at);

    /* LA PELLICULE : la couverture d'abord, puis les autres photos du
       groupe dans l'ordre chronologique. Une seule vue est generee par
       photo REELLE — c'est ce qui supprime definitivement la case vide. */
    var autres = membres.filter(function (m) { return m && m.id !== couverture.id; });
    var photos = [couverture.photo_url].concat(autres.map(function (m) { return m.photo_url; }))
      .filter(function (u) { return !!u; });
    if (!photos.length) photos = [story.photo_url];

    /* La visionneuse recoit les adresses D'ORIGINE, sans transformation :
       c'est le seul endroit ou l'on veut la photo entiere et intacte, et
       elle ne se charge que sur un tap volontaire. */
    galerie = photos.slice();

    var vues = photos.map(function (u, k) {
      var src = echapper(urlRendu(u, 1600, 88));
      return '<div class="vue">'
        + '<div class="flou" style="background-image:url(' + src + ')"></div>'
        + '<img src="' + src + '" data-orig="' + echapper(u) + '" data-i="' + k + '" alt="">'
        + '</div>';
    }).join('');

    var jauges = photos.length > 1
      ? '<div class="jauges" id="jauges">' + photos.map(function (u, k) {
          return '<div class="jauge' + (k === 0 ? ' active' : '') + '"></div>';
        }).join('') + '</div>'
      : '';

    var fleches = photos.length > 1
      ? '<button class="fleche f-prec" id="fPrec" aria-label="' + echapper(t("prec")) + '">&lsaquo;</button>'
        + '<button class="fleche f-suiv" id="fSuiv" aria-label="' + echapper(t("suiv")) + '">&rsaquo;</button>'
      : '';

    /* ========================================================================
       20bt (01/09) — LE STYLE DE LA LEGENDE SUR LA PAGE PUBLIQUE.
       La colonne `style_legende` de `hype_stories` porte un petit JSON :
       {"c":"#20D9F5","t":"grand","g":true,"p":"cinzel"}. Il est ecrit par
       l'app (hype-stories.js, vocabulaire 20bt) et doit etre rendu ICI A
       L'IDENTIQUE : c'est cette page que voient les gens hors de Hype, et une
       story qui change d'allure en sortant de l'app est le defaut qu'on a
       corrige le 01/09 au matin.
       ⚠️ CES TROIS NOMBRES SONT RECOPIES DE hype-stories.js (HS_STYLE_TAILLES).
       Cette page ne peut pas lire le module. Si les multiplicateurs bougent
       la-bas, les bouger ici -- sinon la meme story n'aura pas la meme taille
       de texte selon l'endroit ou on la regarde.
       ⚠️ LES SIX POLICES DOIVENT ETRE DANS L'@import EN TETE DE FICHIER.
       Une police absente de l'import s'afficherait en repli : meme faute.
       ⚠️ L'OMBRE PORTEE EST TOUJOURS POSEE quand un style existe : la couleur
       est libre (choix de Blandine), et c'est elle qui empeche un texte fonce
       de disparaitre sur le noir. */
    var ST_TAILLES = { petit: 0.85, normal: 1, grand: 1.25 };
    var ST_POLICES = {
      montserrat: "'Montserrat',sans-serif",
      cinzel: "'Cinzel',Georgia,serif",
      anton: "'Anton',sans-serif",
      oswald: "'Oswald',sans-serif",
      cormorant: "'Cormorant Garamond',Georgia,serif",
      baloo: "'Baloo 2',cursive,sans-serif"
    };
    function styleLegende(brut) {
      try {
        if (!brut) return '';
        var o = (typeof brut === "string") ? JSON.parse(brut) : brut;
        if (!o || typeof o !== "object") return '';
        var css = [];
        if (typeof o.c === "string" && /^#[0-9a-fA-F]{3,8}$/.test(o.c)) css.push("color:" + o.c);
        if (o.t && ST_TAILLES[o.t] && o.t !== "normal") css.push("font-size:" + (Math.round(15 * ST_TAILLES[o.t] * 10) / 10) + "px");
        if (o.g) css.push("font-weight:700");
        if (o.p && ST_POLICES[o.p] && o.p !== "montserrat") css.push("font-family:" + ST_POLICES[o.p]);
        if (!css.length) return '';
        css.push("text-shadow:0 1px 6px rgba(6,7,9,0.85)");
        return ' style="' + css.join(";").replace(/"/g, "") + '"';
      } catch (e) { return ''; }
    }

    /* LE TEXTE : la premiere ligne porte, la suite s'efface. Le tout est
       replie au-dela de 4 lignes — la mesure reelle est faite apres
       l'insertion, le bouton n'apparait que s'il y a vraiment quelque
       chose de cache. */
    var blocTexte = '';
    if (story.legende) {
      var brut = String(story.legende).trim();
      var coupe = brut.indexOf("\n");
      var tete = coupe > 0 ? brut.slice(0, coupe).trim() : brut;
      var suite = coupe > 0 ? brut.slice(coupe).replace(/^\s+/, "") : "";
      /* Seuil de repli : 500 caracteres. En dessous, le texte s'affiche
         ENTIER, sans bouton — cas de l'immense majorite des legendes. */
      var replier = brut.length > 500;
      blocTexte = '<div class="texte">'
        + '<div class="corps' + (replier ? ' replie' : '') + '" id="corps"' + styleLegende(story.style_legende) + '>' + echapper(tete)
        + (suite ? '<span class="suite">' + "\n\n" + echapper(suite) + '</span>' : '')
        + '</div>'
        + (replier ? '<button class="voir-plus" id="voirPlus" style="display:none;">' + echapper(t("plus")) + '</button>' : '')
        + '</div>';
    }

    var blocLieu = story.lieu ? '<div class="lieu">📍 ' + echapper(story.lieu) + '</div>' : '';

    /* LE CLUB — IDENTITE SEULE, PAS DE LIEN.
       31/08, decision de Blandine : « je ne veux pas afficher Voir le
       club si ce lien n'est pas capable d'ouvrir reellement le club
       correspondant ». C'est le cas aujourd'hui : `#e=` est bien lu par
       index.html, mais `window.__clubOuvert` n'est RELU NULLE PART —
       le visiteur serait tombe sur la page club de l'app, pas sur celui
       de la story. Le lien est donc retire, pas seulement masque.
       A remettre le jour ou l'ouverture d'un club precis existera
       vraiment dans Hype. */
    var blocClub = nomClub
      ? '<div class="club">'
        + '<div class="club-nom">' + echapper(nomClub) + '<span class="certif">✓</span></div>'
        + '<div class="club-chiffres" id="clubChiffres" style="display:none;"></div>'
        + '</div>'
      : '';

    document.getElementById("scene").innerHTML = ''
      + '<div class="photo-zone">'
      +   '<div class="pellicule" id="pellicule">' + vues + '</div>'
      +   '<div class="voile"></div>'
      +   jauges
      +   fleches
      +   '<div class="signature">'
      +     '<div class="av" style="' + (avatarUrl ? 'background-image:url(' + echapper(urlRendu(avatarUrl, 160, 90)) + ')' : '') + '"></div>'
      +     '<div><div class="nom-auteur">' + echapper(nomAuteur) + '</div><div class="sous-ligne">' + echapper(sousLigne) + '</div></div>'
      +   '</div>'
      + '</div>'
      + blocTexte
      + blocLieu
      + blocClub;

    document.getElementById("zoneCta").style.display = "block";

    /* Les gestionnaires sont poses APRES l'ecriture du innerHTML : avant,
       les elements n'existent pas encore. */
    var pellicule = document.getElementById("pellicule");

    /* Repli sur l'original si le point de transformation refuse. */
    try {
      var imgs = pellicule.querySelectorAll("img");
      for (var q = 0; q < imgs.length; q++) {
        (function (im) {
          im.addEventListener("error", function () {
            var o = im.getAttribute("data-orig");
            if (o && im.src !== o) im.src = o;
          });
        })(imgs[q]);
      }
    } catch (eF) { }

    /* TAP contre SWIPE : la visionneuse ne doit pas s'ouvrir a la fin
       d'un balayage. On note ou le doigt s'est pose et on n'ouvre que si
       il n'a presque pas bouge. */
    try {
      var depart = null;
      pellicule.addEventListener("pointerdown", function (ev) { depart = { x: ev.clientX, y: ev.clientY }; });
      pellicule.addEventListener("pointerup", function (ev) {
        if (!depart) return;
        var dx = Math.abs(ev.clientX - depart.x), dy = Math.abs(ev.clientY - depart.y);
        depart = null;
        if (dx > 8 || dy > 8) return;
        var cible = ev.target;
        var i = cible && cible.getAttribute ? parseInt(cible.getAttribute("data-i"), 10) : 0;
        ouvrirVisio(isNaN(i) ? 0 : i);
      });
    } catch (eT) { }

    /* Les jauges suivent le doigt. Le calcul est volontairement simple :
       le rang = position du defilement / largeur d'une vue. */
    if (photos.length > 1) {
      var lesJauges = document.querySelectorAll("#jauges .jauge");
      var majJauges = function () {
        var l = pellicule.clientWidth || 1;
        var i = Math.round(pellicule.scrollLeft / l);
        if (i < 0) i = 0;
        if (i > lesJauges.length - 1) i = lesJauges.length - 1;
        for (var k = 0; k < lesJauges.length; k++) {
          if (k === i) lesJauges[k].classList.add("active");
          else lesJauges[k].classList.remove("active");
        }
      };
      pellicule.addEventListener("scroll", function () {
        if (window.requestAnimationFrame) window.requestAnimationFrame(majJauges);
        else majJauges();
      }, { passive: true });

      var glisser = function (sens) {
        var l = pellicule.clientWidth || 1;
        var i = Math.round(pellicule.scrollLeft / l) + sens;
        if (i < 0) i = photos.length - 1;
        if (i > photos.length - 1) i = 0;
        try { pellicule.scrollTo({ left: i * l, behavior: "smooth" }); }
        catch (e) { pellicule.scrollLeft = i * l; }
      };
      try {
        document.getElementById("fPrec").addEventListener("click", function () { glisser(-1); });
        document.getElementById("fSuiv").addEventListener("click", function () { glisser(1); });
      } catch (eFl) { }
      /* Clavier : seulement quand la visionneuse est fermee. */
      document.addEventListener("keydown", function (ev) {
        if (elVisio.classList.contains("on")) return;
        if (ev.key === "ArrowLeft") glisser(-1);
        else if (ev.key === "ArrowRight") glisser(1);
      });
    }

    /* « Voir plus » : le bouton n'existe que si du texte est reellement
       masque (mesure apres rendu, pas au nombre de caracteres). */
    try {
      var corps = document.getElementById("corps");
      var bouton = document.getElementById("voirPlus");
      if (corps && bouton) {
        var verifier = function () {
          if (corps.scrollHeight > corps.clientHeight + 2) bouton.style.display = "inline-block";
        };
        verifier();
        setTimeout(verifier, 400);
        bouton.addEventListener("click", function () {
          var replie = corps.classList.toggle("replie");
          bouton.textContent = replie ? t("plus") : t("moins");
        });
      }
    } catch (eV) { }

    /* Les chiffres du club arrivent apres : ils ne doivent jamais
       retarder l'affichage de la story. */
    if (nomClub) {
      chiffresDuClub(nomClub).then(function (c) {
        try {
          if (!c || !c.cavaliers) return;
          var el = document.getElementById("clubChiffres");
          if (!el) return;
          var bouts = [t("cav")(c.cavaliers)];
          if (c.chevaux) bouts.push(t("che")(c.chevaux));
          el.textContent = bouts.join(" · ");
          el.style.display = "block";
        } catch (eC) { }
      }).catch(function () { });
    }

    try { document.title = t("titre").replace("{n}", nomAuteur); } catch (eT2) { }
  }

  demarrer();
})();
</script>
</body>
</html>
